<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
:root {
--bg-0: #08080a; --bg-1: #0f0f13; --surface: #16161c; --surface-2: #1c1c24; --surface-3: #222229;
--border: #2a2a33; --orange: #ff7a1a; --orange-light: #ffab5e; --orange-dark: #c9500a;
--text: #f2f2f4; --text-dim: #9a9aa6; --green: #4cd964; --red: #ff5c5c;
}
body {
font-family: 'Poppins', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
background: radial-gradient(circle at 50% 0%, #1a1208 0%, var(--bg-0) 55%);
background-attachment: fixed; min-height: 100vh; color: var(--text); padding: 10px;
}
.app {
max-width: 600px; margin: 0 auto; background: var(--bg-1); border: 1px solid var(--border);
border-radius: 16px; box-shadow: 0 0 50px rgba(255,122,26,0.08), 0 20px 40px rgba(0,0,0,0.55);
overflow: hidden;
}
.header {
background: linear-gradient(160deg, #1a1712 0%, #0c0c0f 70%); color: var(--text); padding: 26px 20px;
text-align: center; border-bottom: 1px solid var(--border); position: relative;
}
.header::after {
content: ''; position: absolute; left: 0; right: 0; bottom: -1px; height: 3px;
background: linear-gradient(90deg, transparent, var(--orange), var(--orange-light), var(--orange), transparent);
}
.header h1 {
font-family: 'Rajdhani', sans-serif; font-size: 32px; letter-spacing: 1px; font-weight: 700;
margin-bottom: 4px; color: var(--text); text-shadow: 0 0 18px rgba(255,122,26,0.45);
}
.header p { color: var(--text-dim); font-size: 13px; letter-spacing: 0.5px; }
.content { padding: 20px; }
.tab-buttons { display: flex; gap: 6px; margin-bottom: 20px; border-bottom: 1px solid var(--border); }
.tab-btn {
flex: 1; padding: 10px 4px; border: none; background: none; cursor: pointer; font-size: 12px;
font-weight: 600; color: var(--text-dim); border-bottom: 3px solid transparent; transition: all 0.25s;
font-family: 'Poppins', sans-serif;
}
.tab-btn:hover { color: var(--orange-light); }
.tab-btn.active { color: var(--orange); border-bottom-color: var(--orange); text-shadow: 0 0 12px rgba(255,122,26,0.35); }
.form-group { margin-bottom: 15px; }
label { display: block; margin-bottom: 5px; font-weight: 600; color: var(--text); font-size: 14px; }
input, select, textarea {

}
textarea { resize: vertical; min-height: 80px; }
input::placeholder, textarea::placeholder { color: #6f6f7a; }
input:focus, select:focus, textarea:focus { outline: none; border-color: var(--orange); box-shadow: 0 0 0 3px rgba(255,122,26,0.15); }
button {
background: linear-gradient(135deg, var(--orange) 0%, var(--orange-light) 100%); color: #17120a;
padding: 12px 24px; border: none; border-radius: 8px; font-size: 14px; font-weight: 700; cursor: pointer;

}
button:hover:not(:disabled) { transform: translateY(-2px); box-shadow: 0 6px 22px rgba(255,122,26,0.45); }

button:disabled { opacity: 0.5; cursor: not-allowed; }
.btn-secondary {

}
.btn-secondary:hover:not(:disabled) { background: var(--surface-3); box-shadow: 0 0 14px rgba(255,122,26,0.2); }
.btn-danger { background: linear-gradient(135deg, var(--red) 0%, #b83a3a 100%); color: #fff; box-shadow: 0 4px 16px rgba(255,92,92,0.3); }
.btn-danger:hover:not(:disabled) { transform: translateY(-2px); box-shadow: 0 6px 22px rgba(255,92,92,0.45); }
.workout-day {
background: var(--surface); border: 1px solid var(--border); border-left: 4px solid var(--orange);
padding: 15px; margin-bottom: 15px; border-radius: 10px;
}
.workout-day h3 { font-family: 'Rajdhani', sans-serif; letter-spacing: 0.5px; color: var(--orange-light); margin-bottom: 8px; font-size: 18px; }
.workout-day p { color: var(--text-dim); font-size: 13px; line-height: 1.5; margin-bottom: 10px; }
.exercise-log { background: var(--surface-2); border: 1px solid var(--border); padding: 15px; margin-bottom: 12px; border-radius: 8px; }
.exercise-log h4 { color: var(--text); font-size: 14px; }
.exercise-log-header { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; cursor: pointer; }
.exercise-thumb {
width: 52px; height: 52px; border-radius: 8px; overflow: hidden; background: var(--surface-3);

}
.exercise-thumb img { width: 100%; height: 100%; object-fit: cover; background: #fff; }
.exercise-thumb-fallback { font-size: 20px; }
.exercise-info-hint { font-size: 10.5px; color: var(--orange-light); font-weight: 500; }
.log-inputs { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 10px; }
.log-inputs input { font-size: 13px; }
.log-inputs textarea { grid-column: 1 / -1; min-height: 60px; }
.message { padding: 12px; border-radius: 8px; margin-bottom: 15px; font-size: 13px; border: 1px solid transparent; }
.message.info { background: rgba(255,122,26,0.08); color: var(--orange-light); border-left: 3px solid var(--orange); }
.message.success { background: rgba(76,217,100,0.08); color: var(--green); border-left: 3px solid var(--green); }
.message.error { background: rgba(255,92,92,0.08); color: var(--red); border-left: 3px solid var(--red); }
.chat-container {

}
.chat-messages { flex: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 10px; }
.chat-message { padding: 10px 12px; border-radius: 8px; font-size: 13px; line-height: 1.4; max-width: 90%; white-space: pre-wrap; }
.chat-message.user {

}
.chat-message.assistant { background: var(--surface-2); color: var(--text); border: 1px solid var(--border); align-self: flex-start; margin-right: 10%; }
.chat-input-area { display: flex; gap: 8px; padding: 12px; border-top: 1px solid var(--border); background: var(--surface); }
.chat-input-area input { flex: 1; margin: 0; font-size: 13px; }
.chat-input-area button { flex: 0; padding: 8px 16px; width: auto; }
.plan-update-card {
background: rgba(255,122,26,0.06); border: 1px solid var(--orange-dark); border-radius: 8px; padding: 12px;
margin: -2px 0 4px 0; box-shadow: 0 0 18px rgba(255,122,26,0.12); align-self: flex-start; max-width: 90%;
}
.plan-update-title { font-family: 'Rajdhani', sans-serif; color: var(--orange-light); font-weight: 700; font-size: 14px; letter-spacing: 0.3px; margin-bottom: 6px; }
.plan-update-card p { font-size: 12px; color: var(--text-dim); margin-bottom: 10px; line-height: 1.4; }
.plan-update-actions { display: flex; gap: 8px; }
.btn-confirm { background: linear-gradient(135deg, var(--orange) 0%, var(--orange-light) 100%); color: #17120a; flex: 1; padding: 8px; font-size: 12px; width: auto; box-shadow: none; }
.btn-reject { background: var(--surface-3); color: var(--text-dim); border: 1px solid var(--border); flex: 1; padding: 8px; font-size: 12px; width: auto; box-shadow: none; }
.loading { text-align: center; padding: 20px; color: var(--orange-light); font-weight: 600; }
.spinner {
display: inline-block; width: 20px; height: 20px; border: 3px solid rgba(255,122,26,0.15);
border-top: 3px solid var(--orange); border-radius: 50%; animation: spin 1s linear infinite; margin-right: 10px;
}
@keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
.stats { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 15px; }
.stat-card { background: linear-gradient(135deg, var(--orange) 0%, var(--orange-dark) 100%); color: #17120a; padding: 15px; border-radius: 10px; text-align: center; }
.stat-card .value { font-family: 'Rajdhani', sans-serif; font-size: 26px; font-weight: 700; margin-bottom: 5px; }
.stat-card .label { font-size: 12px; opacity: 0.85; }
.close-btn { background: var(--surface-2); color: var(--text); padding: 8px 12px; font-size: 12px; width: auto; margin-top: 10px; box-shadow: none; }
.session-timer-bar { display: flex; align-items: center; justify-content: space-between; gap: 10px; background: var(--surface); border: 1px solid var(--orange-dark); border-radius: 10px; padding: 12px 14px; margin-bottom: 18px; }
.session-timer-display { font-family: 'Rajdhani', sans-serif; font-size: 24px; font-weight: 700; color: var(--orange-light); letter-spacing: 1px; }
.sets-count-line { font-size: 12px; color: var(--text-dim); margin-bottom: 8px; }
.sets-recorded-list { display: flex; flex-direction: column; gap: 6px; margin-bottom: 14px; }
.set-recorded-row { display: flex; justify-content: space-between; background: var(--surface-2); border: 1px solid var(--border); border-radius: 6px; padding: 6px 10px; font-size: 12.5px; color: var(--text); }
.set-input-row { background: var(--surface-2); border: 1px solid var(--border); border-radius: 8px; padding: 12px; margin-bottom: 10px; }
.set-input-row label { display: block; margin-bottom: 8px; font-weight: 600; color: var(--text); font-size: 13px; }
.set-input-fields { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 10px; }
.optional-extra-fields input, .optional-extra-fields textarea { margin-bottom: 10px; }
.set-input-fields { gap: 16px; margin-bottom: 14px; }
.set-input-row { padding: 16px; }
.series-feedback { color: var(--green); font-size: 13px; font-weight: 700; margin-top: 10px; text-align: center; }
.chart-container { display: flex; align-items: flex-end; gap: 8px; height: 150px; margin: 15px 0; padding: 10px; background: var(--surface); border: 1px solid var(--border); border-radius: 10px; }
.chart-bar-wrap { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; height: 100%; }
.chart-bar { width: 100%; background: linear-gradient(180deg, var(--orange-light) 0%, var(--orange) 100%); border-radius: 4px 4px 0 0; min-height: 4px; box-shadow: 0 0 10px rgba(255,122,26,0.3); }
.chart-label { font-size: 11px; color: var(--text-dim); margin-top: 4px; text-align: center; }
.history-week { background: var(--surface); border: 1px solid var(--border); border-left: 4px solid var(--orange-light); padding: 15px; margin-bottom: 12px; border-radius: 10px; }
.history-week-header { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; margin-bottom: 4px; }
.history-week h3 { font-family: 'Rajdhani', sans-serif; color: var(--orange-light); font-size: 17px; }
.section-title { font-family: 'Rajdhani', sans-serif; font-size: 16px; letter-spacing: 0.4px; color: var(--text); margin-bottom: 10px; font-weight: 700; }
.dashboard-block { margin-bottom: 22px; padding-bottom: 18px; border-bottom: 1px solid var(--border); }
.type-stats-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(135px, 1fr)); gap: 10px; }
.type-stat-card { background: linear-gradient(150deg, var(--orange) 0%, var(--orange-dark) 100%); color: #17120a; border-radius: 10px; padding: 13px 10px; text-align: center; box-shadow: 0 4px 14px rgba(255,122,26,0.2); }
.type-stat-icon { font-size: 22px; margin-bottom: 4px; }
.type-stat-name { font-size: 10.5px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.4px; opacity: 0.8; margin-bottom: 3px; }
.type-stat-value { font-family: 'Rajdhani', sans-serif; font-size: 21px; font-weight: 700; line-height: 1.1; }
.type-stat-sub { font-size: 11px; opacity: 0.85; margin-top: 2px; }
.workout-card { background: var(--surface-2); border: 1px solid var(--border); border-left: 4px solid var(--orange); border-radius: 8px; padding: 12px 14px; margin-bottom: 10px; cursor: pointer; transition: border-color 0.2s, background 0.2s; }
.workout-card:hover { border-left-color: var(--orange-light); background: var(--surface-3); }
.workout-card-header { display: flex; justify-content: space-between; align-items: center; font-size: 14px; color: var(--text); gap: 8px; }
.workout-card-header-left { display: flex; align-items: center; gap: 8px; overflow: hidden; }
.workout-card-header-right { display: flex; align-items: center; gap: 6px; flex-shrink: 0; }
.workout-card-icon { font-size: 17px; }
.workout-card-daytype { color: var(--orange-light); font-weight: 600; }
.chevron { color: var(--orange-light); font-size: 13px; flex-shrink: 0; }
.workout-card-summary { font-size: 12px; color: var(--text-dim); margin-top: 5px; }
.workout-card-body { margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--border); display: flex; flex-direction: column; gap: 8px; }
.history-exercise-row { display: flex; align-items: flex-start; gap: 8px; }
.workout-card-exercise-name { color: var(--text); font-weight: 600; font-size: 13px; margin-bottom: 2px; }
.workout-card-exercise-detail { color: var(--text-dim); font-size: 12px; line-height: 1.4; }
.workout-card-total { margin-top: 4px; font-size: 13px; color: var(--orange-light); font-weight: 700; }
.btn-delete-week { width: auto; padding: 6px 10px; background: var(--surface-2); border: 1px solid var(--red); color: var(--red); box-shadow: none; font-size: 12px; flex-shrink: 0; }
.btn-delete-week:hover { background: rgba(255,92,92,0.1); transform: none; }
.btn-delete-day { width: auto; padding: 2px 6px; background: transparent; border: none; box-shadow: none; font-size: 14px; color: var(--red); cursor: pointer; }
.btn-delete-day:hover { transform: none; opacity: 0.7; }
.btn-delete-exercise { width: auto; padding: 4px 8px; background: transparent; border: none; box-shadow: none; color: var(--red); font-size: 13px; cursor: pointer; flex-shrink: 0; }
.btn-delete-exercise:hover { transform: none; opacity: 0.7; }
.preset-row { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
.preset-btn { width: auto; padding: 8px 12px; font-size: 12px; background: var(--surface-2); color: var(--orange-light); border: 1px solid var(--orange-dark); box-shadow: none; }
.preset-btn:hover { background: var(--surface-3); box-shadow: 0 0 10px rgba(255,122,26,0.15); transform: none; }
.equipment-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px,1fr)); gap: 8px; }

.equipment-chip input { width: auto; margin: 0; }

.modal-box { background: var(--bg-1); border: 1px solid var(--border); border-radius: 14px; max-width: 420px; width: 100%; padding: 18px; box-shadow: 0 0 60px rgba(255,122,26,0.15); max-height: 90vh; overflow-y: auto; }
.modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; gap: 10px; }

.modal-media img { width: 100%; height: 100%; object-fit: contain; background: #fff; }
.modal-media-fallback { color: var(--text-dim); text-align: center; font-size: 14px; }
.btn-video { display: block; text-align: center; background: linear-gradient(135deg, var(--orange) 0%, var(--orange-light) 100%); color: #17120a; padding: 10px; border-radius: 8px; font-weight: 700; font-size: 13px; text-decoration: none; }
.calendar-nav { display: flex; align-items: center; justify-content: center; gap: 14px; margin: 6px 0 12px 0; }
.calendar-nav-btn { width: auto; padding: 6px 14px; font-size: 16px; font-weight: 700; }

.calendar-day { position: relative; aspect-ratio: 1 / 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; background: var(--surface); border: 1px solid var(--border); border-radius: 8px; cursor: pointer; transition: border-color 0.15s, background 0.15s; padding: 2px; }
.calendar-day:hover { border-color: var(--orange-dark); }
.calendar-day-muted { opacity: 0.3; }
.calendar-day-workout { background: rgba(255,122,26,0.1); border-color: var(--orange-dark); }
.calendar-day-selected { border-color: var(--orange); box-shadow: 0 0 0 2px rgba(255,122,26,0.3); }
.calendar-day-number { font-size: 12px; color: var(--text); font-weight: 600; }
.calendar-day-icons { font-size: 12px; line-height: 1; }

.calendar-day-detail-title { font-family: 'Rajdhani', sans-serif; color: var(--orange-light); font-size: 15px; margin-bottom: 8px; text-transform: capitalize; }
.calendar-day-empty { color: var(--text-dim); font-size: 13px; }
.calendar-day-entry { margin-bottom: 10px; }
.calendar-day-entry:last-child { margin-bottom: 0; }
.calendar-day-entry-header { color: var(--text); font-weight: 600; font-size: 13px; margin-bottom: 3px; }
.calendar-day-entry-summary { color: var(--text-dim); font-size: 12.5px; }

::-webkit-scrollbar-track { background: var(--bg-0); }

@keyframes dragSettle { 0% { transform: scale(1.03); } 100% { transform: scale(1); } }

const IDB_NAME = 'FitCoachDB';
const IDB_VERSION = 1;
let idbInstancePromise = null;

function initDB() {
  if (idbInstancePromise) return idbInstancePromise;
  idbInstancePromise = new Promise((resolve, reject) => {
    if (!window.indexedDB) { reject(new Error("IndexedDB non supporte par ce navigateur")); return; }
    const request = indexedDB.open(IDB_NAME, IDB_VERSION);
    request.onupgradeneeded = (event) => {
      const db = event.target.result;
      if (!db.objectStoreNames.contains('config')) db.createObjectStore('config');
      if (!db.objectStoreNames.contains('plans')) db.createObjectStore('plans');
      if (!db.objectStoreNames.contains('history')) db.createObjectStore('history');
      if (!db.objectStoreNames.contains('weights')) db.createObjectStore('weights');
    };
    request.onsuccess = (event) => resolve(event.target.result);
    request.onerror = (event) => reject((event.target && event.target.error) || new Error("Erreur ouverture IndexedDB"));
    request.onblocked = () => reject(new Error('Ouverture IndexedDB bloquee (autre onglet ouvert)'));
  });
  return idbInstancePromise;
}

function idbPut(storeName, key, value) {
  return initDB().then((db) => new Promise((resolve, reject) => {
    try {
      const tx = db.transaction(storeName, 'readwrite');
      const store = tx.objectStore(storeName);
      const req = store.put(value, key);
      req.onsuccess = () => resolve(true);
      req.onerror = (e) => reject((e.target && e.target.error) || new Error('Erreur ecriture IndexedDB (' + storeName + ')'));
    } catch (e) { reject(e); }
  }));
}

function idbGet(storeName, key) {
  return initDB().then((db) => new Promise((resolve, reject) => {
    try {
      const tx = db.transaction(storeName, 'readonly');
      const store = tx.objectStore(storeName);
      const req = store.get(key);
      req.onsuccess = () => resolve(req.result !== undefined ? req.result : null);
      req.onerror = (e) => reject((e.target && e.target.error) || new Error('Erreur lecture IndexedDB (' + storeName + ')'));
    } catch (e) { reject(e); }
  }));
}

function idbGetAll(storeName) {
  return initDB().then((db) => new Promise((resolve, reject) => {
    try {
      const tx = db.transaction(storeName, 'readonly');
      const store = tx.objectStore(storeName);
      if (store.getAll) {
        const req = store.getAll();
        req.onsuccess = () => resolve(req.result || []);
        req.onerror = (e) => reject((e.target && e.target.error) || new Error('Erreur lecture IndexedDB (' + storeName + ')'));
      } else {
        const results = [];
        const req = store.openCursor();
        req.onsuccess = (event) => {
          const cursor = event.target.result;
          if (cursor) { results.push(cursor.value); cursor.continue(); }
          else resolve(results);
        };
        req.onerror = (e) => reject((e.target && e.target.error) || new Error('Erreur lecture IndexedDB (' + storeName + ')'));
      }
    } catch (e) { reject(e); }
  }));
}

function idbClearStore(storeName) {
  return initDB().then((db) => new Promise((resolve, reject) => {
    try {
      const tx = db.transaction(storeName, 'readwrite');
      const store = tx.objectStore(storeName);
      const req = store.clear();
      req.onsuccess = () => resolve(true);
      req.onerror = (e) => reject((e.target && e.target.error) || new Error('Erreur suppression IndexedDB (' + storeName + ')'));
    } catch (e) { reject(e); }
  }));
}

function saveConfig(data) { return idbPut('config', 'user', data); }
function loadConfig() { return idbGet('config', 'user').catch((e) => { console.error('loadConfig error', e); return null; }); }
function savePlan(weekNum, planData) { return idbPut('plans', 'week_' + weekNum, planData); }
function loadPlan(weekNum) { return idbGet('plans', 'week_' + weekNum).catch((e) => { console.error('loadPlan error', e); return null; }); }
function saveToHistory(weekEntry) { return idbPut('history', 'week_' + weekEntry.week, weekEntry); }
function loadHistory() { return idbGetAll('history').then((arr) => arr.slice().sort((a, b) => (a.week || 0) - (b.week || 0))).catch((e) => { console.error('loadHistory error', e); return []; }); }
function saveWeightEntry(dateStr, weightVal) { return idbPut('weights', dateStr, { date: dateStr, weight: weightVal }).catch((e) => { console.error('saveWeightEntry error', e); }); }
function loadWeights() { return idbGetAll('weights').catch((e) => { console.error('loadWeights error', e); return []; }); }
function deleteAllData() { return Promise.all(['config', 'plans', 'history', 'weights'].map((s) => idbClearStore(s))); }

            exerciseProgression: JSON.parse(localStorage.getItem('exerciseProgression') || '[]')

          const legacyPlan = JSON.parse(localStorage.getItem('weekPlan') || 'null');
          const legacyLogs = JSON.parse(localStorage.getItem('logs') || '{}');

          }
          const legacyHistory = JSON.parse(localStorage.getItem('weekHistory') || '[]');
          for (let i = 0; i < legacyHistory.length; i++) { await saveToHistory(legacyHistory[i]); }
          ['apiKey','userLevel','userEquipmentList','userEquipment','userGoals','userWeight','userAge','userHeight','weekPlan','weekNumber','logs','weekHistory','chatMessages','pendingPlanUpdate','exerciseProgression','sessionCalories'].forEach((k) => localStorage.removeItem(k));
          localStorage.setItem('fitcoach_idb_migrated', 'true');
          idbConfig = legacyConfig;
          if (!cancelled) setMessage('Donnees migrees vers IndexedDB avec succes');
        } else {
          localStorage.setItem('fitcoach_idb_migrated', 'true');
        }
      }

      if (idbConfig) {
        if (!cancelled) {
          setApiKey(idbConfig.apiKey || '');
          setUserLevel(idbConfig.userLevel || 'intermediate');
          if (Array.isArray(idbConfig.userEquipmentList) && idbConfig.userEquipmentList.length) setUserEquipmentList(idbConfig.userEquipmentList);

          setUserWeight(idbConfig.userWeight || '');

          if (idbConfig.pendingPlanUpdate) setPendingPlanUpdate(idbConfig.pendingPlanUpdate);
          if (Array.isArray(idbConfig.exerciseProgression)) setExerciseProgression(idbConfig.exerciseProgression);
        }
        const wn = idbConfig.weekNumber || weekNumber;
        if (!cancelled) setWeekNumber(wn);
        const planData = await loadPlan(wn);
        if (planData && !cancelled) {
          if (planData.currentWeekPlan) setCurrentWeekPlan(planData.currentWeekPlan);
          if (planData.logs) setLogs(planData.logs);
          if (planData.exerciseOrder) setExerciseOrder(planData.exerciseOrder);
          if (planData.sessionCalories) setSessionCalories(planData.sessionCalories);
        }
      }

      const hist = await loadHistory();
      if (!cancelled && hist && hist.length) setWeekHistory(hist);

      if (!cancelled) setDataReady(true);
    } catch (e) {
      console.error('Erreur initialisation IndexedDB', e);
      if (!cancelled) {
        setMessage('Erreur IndexedDB: ' + (e && e.message ? e.message : 'inconnue'));
        setDataReady(true);
      }
    }
  }
  initAndMigrate();
  return () => { cancelled = true; };
}, []);

const parseTimeToMinutes = (str) => {
if (!str) return 0;
const parts = String(str).split(':').map(p => parseFloat(p)).filter(n => !isNaN(n));
if (parts.length === 0) {
const n = parseFloat(str);
return isNaN(n) ? 0 : n;
}
if (parts.length === 1) return parts[0];
if (parts.length === 2) return parts[0] + parts[1] / 60;
if (parts.length === 3) return parts[0] * 60 + parts[1] + parts[2] / 60;
return 0;
};

const computeDayStats = (weekEntry, dayIdx, day) => {
let volume = 0, distance = 0, timeMin = 0, loggedCount = 0;
(day.exercises || []).forEach((ex, exIdx) => {
const log = (weekEntry.logs || {})[dayIdx + '-' + exIdx];
if (!log) return;
const sets = log.series || [];
sets.forEach(s => {
const w = parseFloat(s.weight) || 0;
const r = parseFloat(s.reps) || 0;
if (w && r) volume += w * r;
});
if (log.distance) distance += parseFloat(log.distance) || 0;
if (log.time) timeMin += parseTimeToMinutes(log.time);
if (sets.length > 0 || log.distance || log.time || log.notes) loggedCount++;
});
return {
volume: Math.round(volume),
distance: Math.round(distance * 10) / 10,
timeMin: Math.round(timeMin),
loggedCount
};
};

const computeWeekTotalVolume = (weekEntry) => {

};

const computeDayDurationSeconds = (day, dayIdx, logsObj) => {
let total = 0;
(day.exercises || []).forEach((ex, exIdx) => {
const log = logsObj[dayIdx + '-' + exIdx];
if (log && log.exerciseStartTime && log.exerciseEndTime) {
total += Math.max(0, (new Date(log.exerciseEndTime) - new Date(log.exerciseStartTime)) / 1000);
}
});
return total;
};

if (period === 'year') return new Date(now.getTime() - 365 * 24 * 3600 * 1000);

};

};

if (log.distance) parts.push(log.distance + 'km');
if (log.time) parts.push(log.time);
if (log.heartRate) parts.push('FC moy: ' + log.heartRate + ' bpm');
return parts.join(' ');
}).join(' | ');
const heartRates = loggedItems.map(item => parseFloat(item.log.heartRate)).filter(n => !isNaN(n));

const localDateStr = (d) => {
  const y = d.getFullYear();
  const m = String(d.getMonth() + 1).padStart(2, '0');

  return y + '-' + m + '-' + day;
};

const dateStrOf = (year, month, day) => {

const getDayDateStr = (dayEntryLogs, day, dayIdx) => {
  let earliest = null;
  (day.exercises || []).forEach((ex, exIdx) => {
    const log = dayEntryLogs[dayIdx + '-' + exIdx];
    if (!log) return;
    let ts = null;
    if (log.exerciseStartTime) ts = log.exerciseStartTime;
    else if (log.series && log.series.length && log.series[0].timestamp) ts = log.series[0].timestamp;
    if (!ts) return;
    const d = new Date(ts);
    if (isNaN(d.getTime())) return;
    if (!earliest || d < earliest) earliest = d;
  });
  return earliest ? localDateStr(earliest) : null;
};

const buildCalendarEntries = () => {
  const map = {};
  const addWeek = (weekEntry, isCurrent) => {
    (weekEntry.plan.days || []).forEach((day, dayIdx) => {
      const dateStr = getDayDateStr(weekEntry.logs || {}, day, dayIdx);
      if (!dateStr) return;
      const stats = computeDayStats(weekEntry, dayIdx, day);
      if (stats.loggedCount === 0) return;
      if (!map[dateStr]) map[dateStr] = [];
      map[dateStr].push({ week: weekEntry.week, dayIdx: dayIdx, day: day, stats: stats, isCurrent: !!isCurrent });
    });
  };
  weekHistory.forEach((w) => addWeek(w, false));
  if (currentWeekPlan) addWeek({ week: currentWeekPlan.week, plan: currentWeekPlan, logs: logs }, true);
  return map;
};

const buildCalendarGrid = (year, month) => {
  const firstOfMonth = new Date(year, month, 1);
  const daysInMonth = new Date(year, month + 1, 0).getDate();
  const daysInPrevMonth = new Date(year, month, 0).getDate();
  let firstWeekday = firstOfMonth.getDay();
  firstWeekday = (firstWeekday + 6) % 7;
  const cells = [];
  for (let i = firstWeekday - 1; i >= 0; i--) {
    const dayNum = daysInPrevMonth - i;
    const m = month === 0 ? 11 : month - 1;
    const y = month === 0 ? year - 1 : year;
    cells.push({ day: dayNum, month: m, year: y, current: false });
  }
  for (let d = 1; d <= daysInMonth; d++) {
    cells.push({ day: d, month: month, year: year, current: true });
  }
  let nextDay = 1;
  while (cells.length % 7 !== 0) {
    const m = month === 11 ? 0 : month + 1;
    const y = month === 11 ? year + 1 : year;
    cells.push({ day: nextDay, month: m, year: y, current: false });
    nextDay++;
  }
  return cells;
};

const computeMonthStats = (calendarEntries, year, month) => {
  let sessions = 0, volume = 0, distance = 0, timeMin = 0;
  Object.keys(calendarEntries).forEach((dateStr) => {
    const parts = dateStr.split('-');
    const y = parseInt(parts[0], 10);
    const m = parseInt(parts[1], 10) - 1;
    if (y === year && m === month) {
      calendarEntries[dateStr].forEach((e) => {
        sessions += 1;
        volume += e.stats.volume;
        distance += e.stats.distance;
        timeMin += e.stats.timeMin;
      });
    }
  });
  return { sessions: sessions, volume: Math.round(volume), distance: Math.round(distance * 10) / 10, timeMin: Math.round(timeMin) };
};

let system = "Tu es un coach sportif IA personnalisé et bienveillant pour l'app FitCoach. Contexte de l'utilisateur: niveau " + userLevel + ', objectifs: "' + (userGoals || 'non précisés') + '", équipement disponible: ' + equipmentDescriptionText() + ", semaine d'entraînement actuelle: " + weekNumber + '. Utilise ce contexte pour donner des conseils personnalisés, concis et pratiques.';
if (currentWeekPlan) {
system += "\n\nVoici le plan d'entraînement actuel de la semaine, au format JSON: " + JSON.stringify(currentWeekPlan) + "\n\nSi, au fil de la discussion, tu identifies qu'une modification concrète de ce plan serait pertinente (ajouter/retirer/remplacer un exercice, changer les séries, répétitions, poids, ou le type d'une séance, etc.), tu peux la proposer activement. Dans ce cas: 1) Explique clairement en langage normal quel changement tu proposes et pourquoi. 2) Demande explicitement la confirmation de l'utilisateur avant d'appliquer quoi que ce soit (tu ne dois JAMAIS appliquer un changement toi-même). 3) À la toute fin de ta réponse uniquement si tu proposes réellement un changement concret, ajoute ce bloc exact contenant le plan COMPLET mis à jour (tous les jours et exercices, modifiés ou non), au format JSON valide strictement identique à la structure fournie: [PLAN_UPDATE_JSON]{...plan complet ici...}[/PLAN_UPDATE_JSON]. N'inclus ce bloc que si un changement concret est proposé, jamais pour un simple conseil général. Ne mentionne jamais ce bloc technique à l'utilisateur, contente-toi de poser ta question de confirmation normalement en texte.";
}
const apiMessages = updatedMessages.slice(-12).map(m => ({ role: m.role, content: m.content }));
const result = await callClaudeAPI(apiMessages, system);
if (result) {
const updateMatch = result.match(/\[PLAN_UPDATE_JSON\]([\s\S]*?)\[\/PLAN_UPDATE_JSON\]/);
let cleanText = result;
let proposedPlan = null;
if (updateMatch) {
cleanText = result.replace(updateMatch[0], '').trim();
try {
const parsed = JSON.parse(updateMatch[1].trim());
if (parsed && Array.isArray(parsed.days)) {
proposedPlan = parsed;
}
} catch (e) {
proposedPlan = null;
}
}
setChatMessages(prev => {
const next = [...prev, { role: 'assistant', content: cleanText || result }];
if (proposedPlan) {
setPendingPlanUpdate({ plan: proposedPlan, forIndex: next.length - 1 });
}
return next;
});
}
setLoading(false);
};

const applyPlanUpdate = () => {
if (!pendingPlanUpdate) return;
setCurrentWeekPlan(pendingPlanUpdate.plan);
setWeekNumber(pendingPlanUpdate.plan.week || weekNumber);
setLogs({});
setExerciseOrder({});
setChatMessages(prev => [...prev, { role: 'assistant', content: "✅ C'est fait, ton plan d'entraînement a été mis à jour !" }]);
setPendingPlanUpdate(null);
setMessage('✅ Plan mis à jour par le coach IA');
};

const rejectPlanUpdate = () => {
setPendingPlanUpdate(null);
setChatMessages(prev => [...prev, { role: 'assistant', content: 'Pas de problème, je ne change rien à ton plan.' }]);
};

const finishWeek = () => {
if (currentWeekPlan) {
const maxWeightsThisWeek = {};
(currentWeekPlan.days || []).forEach((day, dayIdx) => {
(day.exercises || []).forEach((ex, exIdx) => {
const log = logs[dayIdx + '-' + exIdx];
if (!log || !log.series) return;
let maxW = 0;
log.series.forEach(s => { const w = parseFloat(s.weight) || 0; if (w > maxW) maxW = w; });
if (maxW > 0) { if (!maxWeightsThisWeek[ex.name] || maxW > maxWeightsThisWeek[ex.name]) maxWeightsThisWeek[ex.name] = maxW; }
});
});
const nowIso = new Date().toISOString();
const newProgressionEntries = Object.entries(maxWeightsThisWeek).map(([exerciseName, maxWeight]) => ({ exerciseName: exerciseName, maxWeight: maxWeight, week: currentWeekPlan.week, date: nowIso }));
if (newProgressionEntries.length) setExerciseProgression(prev => [...prev, ...newProgressionEntries]);
setWeekHistory(prev => [...prev, { week: currentWeekPlan.week, plan: currentWeekPlan, logs: logs, dayCalories: sessionCalories, completedAt: nowIso }]);
}
setWeekNumber(prev => prev + 1);
setCurrentWeekPlan(null);
setLogs({});
setExerciseOrder({});
setSessionCalories({});
setMessage('');
setCurrentTab('setup');
};

const deleteWeekEntry = (idx) => {
const w = weekHistory[idx];
if (!w) return;
if (!window.confirm('Supprimer définitivement cet entraînement (semaine ' + w.week + ') de ton historique ? Cette action est irréversible.')) return;
setWeekHistory(prev => prev.filter((_, i) => i !== idx));
};

const deleteDayFromWeek = (weekIdx, dayIdx) => {
if (!window.confirm('Supprimer cette séance de ton historique ? Cette action est irréversible.')) return;
setWeekHistory(prev => prev.map((w, i) => {
if (i !== weekIdx) return w;
const newDays = (w.plan.days || []).filter((_, di) => di !== dayIdx);
const newLogs = {};
Object.entries(w.logs || {}).forEach(([key, val]) => {
const parts = key.split('-').map(Number);
const d = parts[0], e = parts[1];
if (d === dayIdx) return;
const newD = d > dayIdx ? d - 1 : d;
newLogs[newD + '-' + e] = val;
});
return { ...w, plan: { ...w.plan, days: newDays }, logs: newLogs };
}));
};

const deleteExerciseLog = (weekIdx, dayIdx, exIdx) => {
if (!window.confirm('Supprimer les données de cet exercice complété ? Cette action est irréversible.')) return;
setWeekHistory(prev => prev.map((w, i) => {
if (i !== weekIdx) return w;
const newLogs = { ...(w.logs || {}) };
delete newLogs[dayIdx + '-' + exIdx];
return { ...w, logs: newLogs };
}));
};

const globalStatsByType = computeGlobalStatsByType();
const totalSessionsCompleted = weekHistory.reduce((sum, w) => sum + ((w.plan.days || []).length), 0);

const reversedHistory = weekHistory.map((w, i) => ({ entry: w, idx: i })).slice().reverse();

return (

)}
{weekHistory.length === 0 && (
<div className="message info">Aucune semaine terminée pour l'instant. Complète ta semaine et clique sur "✅ Terminer la semaine" dans l'onglet Plan pour commencer ton historique.</div>
)}
{weekHistory.length > 0 && (
<div>
<h3 className="section-title">Vue d'ensemble par activité</h3>
<div className="preset-row" style={{marginBottom: '10px'}}>
{[{id: 'week', label: 'Semaine'}, {id: 'month', label: 'Mois'}, {id: 'year', label: 'Année'}, {id: 'all', label: 'Tout'}].map(p => (
<button key={p.id} type="button" className="preset-btn" style={caloriesPeriod === p.id ? {borderColor: 'var(--orange)', color: 'var(--orange)', background: 'var(--surface-3)'} : {}} onClick={() => setCaloriesPeriod(p.id)}>{p.label}</button>
))}
</div>
<div className="stats">
<div className="stat-card">
<div className="value">{totalSessionsCompleted}</div>
<div className="label">Séances complétées</div>
</div>
<div className="stat-card">
<div className="value">{totalVolumeAllTime}</div>
<div className="label">Kg soulevés au total</div>
</div>
<div className="stat-card">
<div className="value">{computeTotalCalories(caloriesPeriod)}</div>
<div className="label">{'🔥 Calories (' + (caloriesPeriod === 'week' ? 'semaine' : caloriesPeriod === 'month' ? 'mois' : caloriesPeriod === 'year' ? 'année' : 'tout') + ')'}</div>
</div>
</div>
<div className="type-stats-grid" style={{marginBottom: '20px'}}>
{Object.entries(globalStatsByType).map(([type, s]) => (
<div className="type-stat-card" key={type}>
<div className="type-stat-icon">{typeIcon(type)}</div>
<div className="type-stat-name">{type}</div>
<div className="type-stat-value">{primaryMetricText(type, s)}</div>
<div className="type-stat-sub">{s.sessions + (s.sessions > 1 ? ' séances' : ' séance')}</div>
</div>
))}
</div>
<h3 style={{marginBottom: '10px', fontSize: '14px', color: 'var(--text-dim)'}}>Volume total (poids x reps) par semaine</h3>
<div className="chart-container">
{weekHistory.slice(-8).map((w, idx, arr) => {
const vol = computeWeekTotalVolume(w);
const maxVol = Math.max.apply(null, arr.map(computeWeekTotalVolume).concat([1]));
const heightPct = Math.max((vol / maxVol) * 100, 4);
return (
<div className="chart-bar-wrap" key={idx}>
<div className="chart-bar" style={{height: heightPct + '%'}} title={vol + ' kg'}></div>
<div className="chart-label">{'S' + w.week}</div>
</div>
);
})}
</div>
<h3 className="section-title" style={{marginTop: '10px'}}>Détail des séances</h3>
{reversedHistory.map(({ entry: w, idx: wIdx }) => (
<div className="history-week" key={wIdx}>
<div className="history-week-header">
<h3>{'Semaine ' + w.week + ' — ' + new Date(w.completedAt).toLocaleDateString('fr-FR')}</h3>
<button className="btn-delete-week" onClick={() => deleteWeekEntry(wIdx)} title="Supprimer cet entraînement de l'historique">🗑️ Supprimer</button>
</div>
<p style={{fontSize: '12px', color: 'var(--orange-light)', marginBottom: '10px'}}>{'Volume: ' + computeWeekTotalVolume(w) + ' kg cumulés'}</p>
{(w.plan.days || []).map((day, dayIdx) => {
const cardKey = w.week + '-' + dayIdx + '-' + wIdx;
const stats = computeDayStats(w, dayIdx, day);
const isOpen = !!expandedWorkouts[cardKey];
return (
<div className="workout-card" key={dayIdx} onClick={() => toggleWorkout(cardKey)}>
<div className="workout-card-header">
<div className="workout-card-header-left">
<span className="workout-card-icon">{typeIcon(day.type)}</span>
<span><strong>{day.day}</strong> <span className="workout-card-daytype">— {day.type}</span></span>
</div>
<div className="workout-card-header-right">
<button className="btn-delete-day" onClick={(e) => { e.stopPropagation(); deleteDayFromWeek(wIdx, dayIdx); }} title="Supprimer cette séance">🗑️</button>
<span className="chevron">{isOpen ? '▾' : '▸'}</span>
</div>
</div>
<div className="workout-card-summary">{summaryLine(day, stats)}{w.dayCalories && w.dayCalories[dayIdx] != null ? (' · 🔥 ' + w.dayCalories[dayIdx] + ' kcal') : ''}</div>
{isOpen && (
<div className="workout-card-body" onClick={(e) => e.stopPropagation()}>
{(day.exercises || []).map((ex, exIdx) => {
const log = (w.logs || {})[dayIdx + '-' + exIdx] || {};
const logSets = log.series || [];
const hasLog = logSets.length > 0 || log.distance || log.time || log.notes;
let maxW = 0;
logSets.forEach(s => { const wt = parseFloat(s.weight) || 0; if (wt > maxW) maxW = wt; });
return (
<div key={exIdx} className="history-exercise-row">
<div style={{flex: 1}}>
<div className="workout-card-exercise-name">{ex.name}</div>
<div className="workout-card-exercise-detail">
{'Prévu: ' + ex.sets + ' x ' + ex.reps + (ex.weight ? (' @ ' + ex.weight) : '')}
{hasLog && (
<React.Fragment><br />
{'Réalisé: '}
{logSets.length > 0 ? (logSets.map((s, si) => (s.weight || '?') + 'kg x ' + (s.reps || '?') + ' reps').join(', ') + ' ') : ''}
{log.distance ? (log.distance + 'km ') : ''}
{log.time ? (log.time + ' ') : ''}
{log.heartRate ? ('· FC moy ' + log.heartRate + 'bpm ') : ''}
{log.notes ? ('— "' + log.notes + '"') : ''}
</React.Fragment>
)}
{maxW > 0 && (<React.Fragment><br />{'💡 max ' + maxW + 'kg → semaine suivante proposé ' + proposeNextWeight(maxW) + 'kg'}</React.Fragment>)}
</div>
</div>
{hasLog && (
<button className="btn-delete-exercise" onClick={(e) => { e.stopPropagation(); deleteExerciseLog(wIdx, dayIdx, exIdx); }} title="Supprimer cet exercice complété">🗑️</button>
)}
</div>
);
})}
<div className="workout-card-total">{totalLine(day, stats)}{w.dayCalories && w.dayCalories[dayIdx] != null ? (' · 🔥 ' + w.dayCalories[dayIdx] + ' kcal') : ''}</div>
</div>
)}
</div>
);
})}
</div>
))}
</div>
)}
</div>
)}

</div>
{exerciseModal && (() => {
const info = getExerciseInfo(exerciseModal.name);
const imgSrc = info && info.id ? (EXERCISE_IMAGE_BASE + info.id + '/' + modalFrame + '.jpg') : null;
const ytUrl = 'https://www.youtube.com/results?search_query=' + encodeURIComponent(exerciseModal.name + ' technique tutoriel exercice');
return (
<div className="modal-overlay" onClick={() => setExerciseModal(null)}>
<div className="modal-box" onClick={(e) => e.stopPropagation()}>
<div className="modal-header">
<h3>{exerciseModal.name}</h3>
<button className="modal-close" onClick={() => setExerciseModal(null)}>✕</button>
</div>
<div className="modal-media">
{imgSrc ? (
<img src={imgSrc} alt={exerciseModal.name} onError={(e) => { e.target.style.display = 'none'; }} />
) : (
<div className="modal-media-fallback">🎥<br />Démo visuelle non disponible pour cet exercice</div>
)}
</div>
<p className="modal-desc">{info ? info.desc : "Description détaillée non disponible pour cet exercice. Consulte la vidéo ci-dessous pour la technique correcte."}</p>
<a className="btn-video" href={ytUrl} target="_blank" rel="noopener noreferrer">▶️ Voir des vidéos explicatives sur YouTube</a>
</div>
</div>
);
})()}
{logModal && (() => {
const info = getExerciseInfo(logModal.name);
const key = logModal.dayIdx + '-' + logModal.exIdx;
const logged = logs[key] || {};
const sets = logged.series || [];
const imgSrc = info && info.id ? (EXERCISE_IMAGE_BASE + info.id + '/' + logModalFrame + '.jpg') : null;
const typeNorm = normalizeText(logModal.type || '');
const isMixedType = /crossfit|wod|mixte/.test(typeNorm);
const isCardioOnly = !isMixedType && /cardio|running|course|velo|cycl|rando|hike|marche/.test(typeNorm);
const showStrengthFields = isMixedType || !isCardioOnly;
const showCardioFields = isMixedType || isCardioOnly;
const showHeartRateField = isMixedType || isCardioOnly;
const computeAllureStr = (distanceVal, timeVal) => {
const dist = parseFloat(distanceVal);
const timeMin = parseTimeToMinutes(timeVal);
if (!dist || dist <= 0 || !timeMin || timeMin <= 0) return '';
const totalSeconds = Math.round((timeMin / dist) * 60);
const m = Math.floor(totalSeconds / 60);
const s = totalSeconds % 60;
return m + ':' + String(s).padStart(2, '0');
};
const exerciseElapsedSec = logged.exerciseStartTime ? Math.max(0, Math.round(((logged.exerciseEndTime ? new Date(logged.exerciseEndTime) : new Date()) - new Date(logged.exerciseStartTime)) / 1000)) : null;
return (
<div className="modal-overlay" onClick={closeLogModal}>
<div className="modal-box" onClick={(e) => e.stopPropagation()}>
<div className="modal-header">
<h3>{logModal.name}</h3>
<button className="modal-close" onClick={closeLogModal}>✕</button>
</div>
<div className="modal-media">
{imgSrc ? (
<img src={imgSrc} alt={logModal.name} onError={(e) => { e.target.style.display = 'none'; }} />
) : (
<div className="modal-media-fallback">🎥<br />Démo visuelle non disponible pour cet exercice</div>
)}
</div>
{showStrengthFields && sets.length > 0 && (
<div className="sets-recorded-list">
{sets.map((s, si) => (
<div key={si} className="set-recorded-row">
<span>{'Série ' + (si + 1)}</span>
<span>{(s.weight || '?') + ' kg x ' + (s.reps || '?') + ' reps'}</span>
</div>
))}
</div>
)}
{showStrengthFields && (
<div className="set-input-row">
<label>{'Série ' + (sets.length + 1)}</label>
<div className="set-input-fields">
<input type="number" placeholder="Poids (kg)" value={currentSetWeight} onChange={(e) => setCurrentSetWeight(e.target.value)} />
<input type="number" placeholder="Reps" value={currentSetReps} onChange={(e) => setCurrentSetReps(e.target.value)} />
</div>
<button type="button" onClick={saveSet}>💾 ENREGISTRER SÉRIE</button>
{seriesFeedback && <p className="series-feedback">Série enregistrée ✓</p>}
{restTimer ? (
<div style={{textAlign: 'center', marginTop: '12px'}}>
{restTimer.running ? (
<React.Fragment>
<div className="session-timer-display" style={{color: 'var(--red)'}}>{'⏳ Pause: ' + formatMMSS(restTimer.secondsLeft)}</div>
<button type="button" className="btn-secondary" style={{marginTop: '8px', width: 'auto', padding: '6px 14px', fontSize: '12px'}} onClick={() => setRestTimer(null)}>Passer la pause</button>
</React.Fragment>
) : (
<div style={{color: 'var(--green)', fontWeight: 700}}>Pause terminée ✓</div>
)}
</div>
) : (
<div style={{marginTop: '12px'}}>
<p style={{fontSize: '12px', color: 'var(--text-dim)', marginBottom: '6px'}}>Pause ?</p>
<div style={{display: 'flex', gap: '8px'}}>
{[30, 60, 90, 120].map(sec => (
<button key={sec} type="button" className="btn-secondary" style={{width: 'auto', flex: 1, padding: '8px', fontSize: '12px'}} onClick={() => startRestTimer(sec)}>{sec + 's'}</button>
))}
</div>
</div>
)}
{exerciseElapsedSec != null && (
<p style={{fontSize: '12px', color: 'var(--text-dim)', marginTop: '10px'}}>{'⏱️ Durée calc: ' + formatMMSS(exerciseElapsedSec)}</p>
)}
</div>
)}
<div className="optional-extra-fields">
{showCardioFields && (
<React.Fragment>
<p className="section-title" style={{fontSize: '13px', marginTop: '4px'}}>Détails de la séance</p>
<input type="number" placeholder="Distance (km)" value={logged.distance || ''} onChange={(e) => logExercise(logModal.dayIdx, logModal.exIdx, {distance: e.target.value, allure: computeAllureStr(e.target.value, logged.time)})} />
<input type="text" placeholder="Temps (ex: 30:45)" value={logged.time || ''} onChange={(e) => logExercise(logModal.dayIdx, logModal.exIdx, {time: e.target.value, allure: computeAllureStr(logged.distance, e.target.value)})} />
{logged.allure && (<p style={{fontSize: '12px', color: 'var(--orange-light)', margin: '-6px 0 10px'}}>{'🏃 Allure: ' + logged.allure + ' par km'}</p>)}
</React.Fragment>
)}
{showHeartRateField && (
<input type="number" placeholder="FC moyenne (bpm) - optionnel" value={logged.heartRate || ''} onChange={(e) => logExercise(logModal.dayIdx, logModal.exIdx, {heartRate: e.target.value})} />
)}
<p className="section-title" style={{fontSize: '13px', marginTop: (showCardioFields || showHeartRateField) ? '10px' : '14px'}}>Notes</p>
<textarea placeholder="Notes (sensation, difficulté...)" value={logged.notes || ''} onChange={(e) => logExercise(logModal.dayIdx, logModal.exIdx, {notes: e.target.value})} />
</div>
<button type="button" className="btn-secondary" style={{marginTop: '12px'}} onClick={closeLogModal}>🏁 TERMINER CET EXERCICE</button>
</div>
</div>
);
})()}
{exerciseSummary && (
<div className="modal-overlay" onClick={() => setExerciseSummary(null)}>
<div className="modal-box" onClick={(e) => e.stopPropagation()} style={{textAlign: 'center'}}>
<h3 style={{marginBottom: '10px'}}>✅ Exercice terminé</h3>
<p style={{marginBottom: '6px'}}>{exerciseSummary.name}</p>
<p style={{marginBottom: '6px'}}>{'Séries: ' + exerciseSummary.seriesCount}</p>
<p>{exerciseSummary.durationSec != null ? ('Durée: ' + formatMMSS(exerciseSummary.durationSec)) : ''}</p>
</div>
</div>
)}
{sessionSummary && (
<div className="modal-overlay" onClick={() => setSessionSummary(null)}>
<div className="modal-box" onClick={(e) => e.stopPropagation()} style={{textAlign: 'center'}}>
<h3 style={{marginBottom: '10px'}}>🔥 Calories estimées</h3>
{sessionSummary.days.map((d, i) => (<p key={i} style={{marginBottom: '6px'}}>{d.name + ': ' + d.calories + ' kcal'}</p>))}
<button type="button" className="btn-secondary" style={{marginTop: '10px'}} onClick={() => setSessionSummary(null)}>Fermer</button>
</div>
</div>
)}
</div>
);
}

ReactDOM.render(<FitCoachApp />, document.getElementById('root'));
</script>
</body>
</html>
