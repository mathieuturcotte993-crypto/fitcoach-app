<html lang="fr">
<head>

<title>FitCoach - Votre App d'Entraînement</title>

<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
:root {
--bg-0: #08080a; --bg-1: #0f0f13; --surface: #16161c; --surface-2: #1c1c24; --surface-3: #222229;
--border: #2a2a33; --orange: #ff7a1a; --orange-light: #ffab5e; --orange-dark: #c9500a;
--text: #f2f2f4; --text-dim: #9a9aa6; --green: #4cd964; --red: #ff5c5c;
}
body {
font-family: 'Poppins', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
background: radial-gradient(circle at 50% 0%, #1a1208 0%, var(--bg-0) 55%);
background-attachment: fixed; min-height: 100vh; color: var(--text); padding: 10px;
}
.app {
max-width: 600px; margin: 0 auto; background: var(--bg-1); border: 1px solid var(--border);
border-radius: 16px; box-shadow: 0 0 50px rgba(255,122,26,0.08), 0 20px 40px rgba(0,0,0,0.55);
overflow: hidden;
}
.header {
background: linear-gradient(160deg, #1a1712 0%, #0c0c0f 70%); color: var(--text); padding: 26px 20px;
text-align: center; border-bottom: 1px solid var(--border); position: relative;
}
.header::after {
content: ''; position: absolute; left: 0; right: 0; bottom: -1px; height: 3px;
background: linear-gradient(90deg, transparent, var(--orange), var(--orange-light), var(--orange), transparent);
}
.header h1 {
font-family: 'Rajdhani', sans-serif; font-size: 32px; letter-spacing: 2px; font-weight: 700;
margin-bottom: 4px; color: var(--orange); text-shadow: 0 0 18px rgba(255,122,26,0.45);
}
.header p { color: var(--text-dim); font-size: 13px; letter-spacing: 0.5px; }
.content { padding: 20px; }
.tab-buttons { display: flex; gap: 6px; margin-bottom: 20px; border-bottom: 1px solid var(--border); }
.tab-btn {
flex: 1; padding: 10px 4px; border: none; background: none; cursor: pointer; font-size: 12px;
font-weight: 600; color: var(--text-dim); border-bottom: 3px solid transparent; transition: all 0.25s;
font-family: 'Poppins', sans-serif;
}
.tab-btn:hover { color: var(--orange-light); }
.tab-btn.active { color: var(--orange); border-bottom-color: var(--orange); text-shadow: 0 0 12px rgba(255,122,26,0.35); }
.form-group { margin-bottom: 15px; }
label { display: block; margin-bottom: 5px; font-weight: 600; color: var(--text); font-size: 14px; }
input, select, textarea {
width: 100%; padding: 10px; border: 1px solid var(--border); border-radius: 8px; font-size: 14px;
font-family: inherit; background: var(--surface-2); color: var(--text);
}
textarea { resize: vertical; min-height: 80px; }
input::placeholder, textarea::placeholder { color: #6f6f7a; }
input:focus, select:focus, textarea:focus { outline: none; border-color: var(--orange); box-shadow: 0 0 0 3px rgba(255,122,26,0.15); }
button {
background: linear-gradient(135deg, var(--orange) 0%, var(--orange-light) 100%); color: #17120a;
padding: 12px 24px; border: none; border-radius: 8px; font-size: 14px; font-weight: 700; cursor: pointer;
transition: transform 0.2s, box-shadow 0.2s; width: 100%; font-family: 'Poppins', sans-serif;
box-shadow: 0 4px 16px rgba(255,122,26,0.3);
}
button:hover:not(:disabled) { transform: translateY(-2px); box-shadow: 0 6px 22px rgba(255,122,26,0.45); }

.btn-secondary {
background: var(--surface-2); color: var(--orange-light); border: 1px solid var(--orange-dark); box-shadow: none;
}
.btn-secondary:hover:not(:disabled) { background: var(--surface-3); box-shadow: 0 0 14px rgba(255,122,26,0.2); }
.btn-danger { background: linear-gradient(135deg, var(--red) 0%, #b83a3a 100%); color: #fff; box-shadow: 0 4px 16px rgba(255,92,92,0.3); }
.btn-danger:hover:not(:disabled) { transform: translateY(-2px); box-shadow: 0 6px 22px rgba(255,92,92,0.45); }
.workout-day {
background: var(--surface); border: 1px solid var(--border); border-left: 4px solid var(--orange);
padding: 15px; margin-bottom: 15px; border-radius: 10px;
}
.workout-day h3 { font-family: 'Rajdhani', sans-serif; letter-spacing: 0.5px; color: var(--orange-light); margin-bottom: 8px; font-size: 18px; }
.workout-day p { color: var(--text-dim); font-size: 13px; line-height: 1.5; margin-bottom: 10px; }
.exercise-log { background: var(--surface-2); border: 1px solid var(--border); padding: 15px; margin-bottom: 12px; border-radius: 8px; }
.exercise-log h4 { color: var(--text); font-size: 14px; }
.exercise-log-header { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; cursor: pointer; }

width: 52px; height: 52px; border-radius: 8px; overflow: hidden; background: var(--surface-3);
border: 1px solid var(--border); display: flex; align-items: center; justify-content: center; flex-shrink: 0;
}
.exercise-thumb img { width: 100%; height: 100%; object-fit: cover; background: #fff; }
.exercise-thumb-fallback { font-size: 20px; }
.exercise-info-hint { font-size: 10.5px; color: var(--orange-light); font-weight: 500; }
.log-inputs { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 10px; }

.message { padding: 12px; border-radius: 8px; margin-bottom: 15px; font-size: 13px; border: 1px solid transparent; }
.message.info { background: rgba(255,122,26,0.08); color: var(--orange-light); border-left: 3px solid var(--orange); }

.chat-message.assistant { background: var(--surface-2); color: var(--text); border: 1px solid var(--border); align-self: flex-start; margin-right: 10%; }
.chat-input-area { display: flex; gap: 8px; padding: 12px; border-top: 1px solid var(--border); background: var(--surface); }
.chat-input-area input { flex: 1; margin: 0; font-size: 13px; }
.chat-input-area button { flex: 0; padding: 8px 16px; width: auto; }
.plan-update-card {

margin: -2px 0 4px 0; box-shadow: 0 0 18px rgba(255,122,26,0.12); align-self: flex-start; max-width: 90%;
}
.plan-update-title { font-family: 'Rajdhani', sans-serif; color: var(--orange-light); font-weight: 700; font-size: 14px; letter-spacing: 0.3px; margin-bottom: 6px; }

.plan-update-actions { display: flex; gap: 8px; }
.btn-confirm { background: linear-gradient(135deg, var(--orange) 0%, var(--orange-light) 100%); color: #17120a; flex: 1; padding: 8px; font-size: 12px; width: auto; box-shadow: none; }
.btn-reject { background: var(--surface-3); color: var(--text-dim); border: 1px solid var(--border); flex: 1; padding: 8px; font-size: 12px; width: auto; box-shadow: none; }
.loading { text-align: center; padding: 20px; color: var(--orange-light); font-weight: 600; }
.spinner {
display: inline-block; width: 20px; height: 20px; border: 3px solid rgba(255,122,26,0.15);
border-top: 3px solid var(--orange); border-radius: 50%; animation: spin 1s linear infinite; margin-right: 10px;
}
@keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
.stats { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 15px; }
.stat-card { background: linear-gradient(135deg, var(--orange) 0%, var(--orange-dark) 100%); color: #17120a; padding: 15px; border-radius: 10px; text-align: center; }
.stat-card .value { font-family: 'Rajdhani', sans-serif; font-size: 26px; font-weight: 700; margin-bottom: 5px; }
.stat-card .label { font-size: 12px; opacity: 0.85; }

.session-timer-bar { display: flex; align-items: center; justify-content: space-between; gap: 10px; background: var(--surface); border: 1px solid var(--orange-dark); border-radius: 10px; padding: 12px 14px; margin-bottom: 18px; }

.set-input-row { background: var(--surface-2); border: 1px solid var(--border); border-radius: 8px; padding: 12px; margin-bottom: 10px; }

.chart-bar-wrap { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; height: 100%; }
.chart-bar { width: 100%; background: linear-gradient(180deg, var(--orange-light) 0%, var(--orange) 100%); border-radius: 4px 4px 0 0; min-height: 4px; box-shadow: 0 0 10px rgba(255,122,26,0.3); }

.type-stat-icon { font-size: 22px; margin-bottom: 4px; }

.workout-card { background: var(--surface-2); border: 1px solid var(--border); border-left: 4px solid var(--orange); border-radius: 8px; padding: 12px 14px; margin-bottom: 10px; cursor: pointer; transition: border-color 0.2s, background 0.2s; }
.workout-card:hover { border-left-color: var(--orange-light); background: var(--surface-3); }
.workout-card-header { display: flex; justify-content: space-between; align-items: center; font-size: 14px; color: var(--text); gap: 8px; }

.workout-card-icon { font-size: 17px; }

.history-exercise-row { display: flex; align-items: flex-start; gap: 8px; }

.workout-card-total { margin-top: 4px; font-size: 13px; color: var(--orange-light); font-weight: 700; }
.btn-delete-week { width: auto; padding: 6px 10px; background: var(--surface-2); border: 1px solid var(--red); color: var(--red); box-shadow: none; font-size: 12px; flex-shrink: 0; }
.btn-delete-week:hover { background: rgba(255,92,92,0.1); transform: none; }

.btn-delete-exercise:hover { transform: none; opacity: 0.7; }
.preset-row { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
.preset-btn { width: auto; padding: 8px 12px; font-size: 12px; background: var(--surface-2); color: var(--orange-light); border: 1px solid var(--orange-dark); box-shadow: none; }
.preset-btn:hover { background: var(--surface-3); box-shadow: 0 0 10px rgba(255,122,26,0.15); transform: none; }

.modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; gap: 10px; }

.calendar-nav { display: flex; align-items: center; justify-content: center; gap: 14px; margin: 6px 0 12px 0; }

{ id: 'muscu_standard', label: '🏋️ Musculation standard (type Éconofitness)', items: ['halteres','barre_olympique','rack_squat','banc','machines_guidees','poulie_cable','tapis_course','assault_bike'] },

function derivePlacesFromEquipment(list) {
if (!Array.isArray(list) || !list.length) return [];
const cands = EQUIPMENT_PRESETS.filter(p => p.items.every(it => list.includes(it)));
return cands.filter(p => !cands.some(o => o.id !== p.id && p.items.every(it => o.items.includes(it)))).map(p => p.id);
}

const EXERCISE_IMAGE_BASE = 'https://raw.githubusercontent.com/yuhonas/free-exercise-db/main/exercises/';

const EXERCISE_LIBRARY = [
{ keys: ['developpe couche','bench press','couche barre','developpe plat'], id: 'Barbell_Bench_Press_-_Medium_Grip', desc: "Allongé sur le banc, saisis la barre en prise pronation un peu plus large que les épaules. Descends-la de façon contrôlée jusqu'à effleurer la poitrine, puis pousse vers le haut en expirant, omoplates serrées et pieds ancrés au sol." },
{ keys: ['developpe incline'], id: 'Barbell_Incline_Bench_Press_-_Medium_Grip', desc: "Sur un banc incliné, pousse la barre depuis la poitrine haute jusqu'à extension complète des bras, en gardant les coudes légèrement rentrés pour cibler le haut des pectoraux." },
{ keys: ['squat'], id: 'Barbell_Full_Squat', desc: "Barre sur le haut du dos, pieds largeur d'épaules. Descends en poussant les hanches vers l'arrière, genoux alignés avec les orteils, jusqu'à ce que les cuisses soient parallèles au sol, puis remonte en poussant dans les talons." },
{ keys: ['souleve de terre','deadlift'], id: 'Barbell_Deadlift', desc: "Pieds sous la barre, dos neutre, saisis la barre juste à l'extérieur des jambes. Pousse dans le sol avec les jambes pour redresser le buste, hanches et genoux se tendant en même temps." },
{ keys: ['traction','pull-up','pullup','pull up'], id: 'Pullups', desc: "Suspendu à la barre en prise pronation, tire le corps vers le haut jusqu'à ce que le menton dépasse la barre en contractant le dos, puis redescends lentement sans te balancer." },
{ keys: ['rowing barre','bent over row','tirage barre','rowing buste penche'], id: 'Bent_Over_Barbell_Row', desc: "Buste penché vers l'avant, dos droit, tire la barre vers le bas de l'abdomen en ramenant les coudes vers l'arrière, puis redescends lentement." },
{ keys: ['developpe militaire','military press','developpe epaules'], id: 'Seated_Barbell_Military_Press', desc: "Assis ou debout, pousse la barre depuis les épaules jusqu'à l'extension complète des bras au-dessus de la tête, sans excès de cambrure dans le bas du dos." },
{ keys: ['curl biceps','curl barre','biceps'], id: 'Barbell_Curl', desc: "Debout, coudes collés au corps, fléchis les avant-bras pour amener la barre vers les épaules, puis redescends lentement sans balancer le buste." },
{ keys: ['extension triceps','triceps'], id: 'Triceps_Pushdown', desc: "À la poulie haute, coudes fixes près du corps, tends les avant-bras vers le bas jusqu'à extension complète, puis reviens lentement en contrôlant la charge." },
{ keys: ['fente','lunge'], id: 'Barbell_Walking_Lunge', desc: "Fais un grand pas vers l'avant et descends jusqu'à ce que les deux genoux forment un angle de 90°, sans que le genou avant dépasse la pointe du pied, puis pousse pour avancer ou revenir." },
{ keys: ['pompe','push-up','pushup','push up'], id: 'Pushups', desc: "Mains légèrement plus larges que les épaules, corps gainé en ligne droite. Descends la poitrine vers le sol en fléchissant les coudes, puis repousse jusqu'à l'extension des bras." },
{ keys: ['planche','plank','gainage'], id: 'Plank', desc: "Appuie-toi sur les avant-bras et les orteils, corps aligné de la tête aux pieds, abdominaux contractés. Maintiens la position sans laisser tomber les hanches." },
{ keys: ['presse a cuisses','leg press'], id: 'Leg_Press', desc: "Assis sur la machine, pieds à largeur d'épaules sur la plateforme. Fléchis les genoux pour descendre la charge puis pousse dans les talons pour revenir en extension, sans verrouiller les genoux." },
{ keys: ['mollet','calf raise'], id: 'Standing_Calf_Raises', desc: "Debout, monte sur la pointe des pieds en contractant les mollets, marque une pause en haut puis redescends lentement sous le niveau de départ." },
{ keys: ['tirage vertical','lat pulldown'], id: 'Wide-Grip_Lat_Pulldown', desc: "Assis face à la poulie haute, saisis la barre en prise large. Tire la barre vers le haut de la poitrine en ramenant les coudes vers le bas, puis remonte lentement." },
{ keys: ['tirage horizontal','rowing poulie','seated row','tirage assis'], id: 'Seated_Cable_Rows', desc: "Assis, jambes légèrement fléchies, tire la poignée vers l'abdomen en ramenant les omoplates vers l'arrière, puis reviens lentement en gardant le dos droit." },
{ keys: ['elevation laterale','lateral raise'], id: 'Side_Lateral_Raise', desc: "Debout, haltères le long du corps, lève les bras sur les côtés jusqu'à hauteur d'épaules avec une légère flexion des coudes, puis redescends lentement." },
{ keys: ['dips'], id: 'Dips_-_Triceps_Version', desc: "En appui sur des barres parallèles, descends le corps en fléchissant les coudes près du corps, puis repousse jusqu'à l'extension complète des bras." },
{ keys: ['burpee'], id: null, desc: "Depuis la position debout, accroupis-toi, place les mains au sol et envoie les jambes en arrière pour une position de planche. Fais une pompe optionnelle, ramène les pieds vers les mains puis saute verticalement en levant les bras." },
{ keys: ['mountain climber','grimpeur'], id: 'Mountain_Climbers', desc: "En position de planche haute, ramène rapidement un genou vers la poitrine puis alterne avec l'autre jambe, comme si tu courais à l'horizontale, bassin stable." },
{ keys: ['jumping jack'], id: null, desc: "Saute en écartant simultanément les jambes et en levant les bras au-dessus de la tête, puis reviens à la position de départ en sautant à nouveau, sur la pointe des pieds." },
{ keys: ['kettlebell swing','swing kettlebell'], id: 'One-Arm_Kettlebell_Swings', desc: "Kettlebell entre les jambes, hanche vers l'arrière puis extension explosive des hanches pour propulser le poids jusqu'à hauteur d'épaules, bras tendus. La puissance vient des hanches." },
{ keys: ['box jump','saut sur box','saut boite'], id: 'Front_Box_Jump', desc: "Fléchis légèrement les genoux puis saute des deux pieds sur la box en te réceptionnant en douceur, genoux fléchis. Redescends en marchant pour préserver les articulations." },
{ keys: ['thruster'], id: 'Kettlebell_Thruster', desc: "Combine un squat avant et un développé militaire: descends en squat en tenant la charge aux épaules, puis en remontant enchaîne directement une poussée des bras au-dessus de la tête." },
{ keys: ['epaule-jete','epaule jete','clean and jerk','clean'], id: 'Clean_and_Jerk', desc: "Mouvement olympique en deux temps: tire la barre du sol jusqu'aux épaules en position de squat (épaulé), puis pousse la barre au-dessus de la tête en fendant légèrement les jambes (jeté)." },
{ keys: ['arrache','snatch'], id: 'Hang_Snatch', desc: "Depuis une position suspendue, tire la barre en une seule extension explosive des hanches et des jambes pour l'amener directement au-dessus de la tête, réceptionnée en squat." },
{ keys: ['corde a sauter','jump rope','double under'], id: null, desc: "Fais tourner la corde avec les poignets et saute juste assez haut pour la laisser passer sous tes pieds. Reste sur la pointe des pieds avec un rythme régulier et léger." },
{ keys: ['rameur','rowing machine','rowing (machine)','ergometre'], id: 'Rowing_Stationary', desc: "Pousse avec les jambes, puis penche légèrement le buste vers l'arrière et enfin tire la poignée vers le bas des côtes. Reviens dans l'ordre inverse: bras, buste, jambes." },
{ keys: ['sit-up','sit up'], id: '3_4_Sit-Up', desc: "Allongé sur le dos, genoux fléchis, mains derrière la tête. Enroule le buste vers les genoux en contractant les abdominaux, puis redescends sans reposer complètement la tête au sol." },
{ keys: ['crunch'], id: 'Crunches', desc: "Allongé, genoux fléchis, décolle uniquement le haut du dos du sol en contractant les abdominaux, sans tirer sur la nuque, puis redescends lentement." },
{ keys: ['russian twist','rotation russe'], id: 'Russian_Twist', desc: "Assis, buste légèrement incliné vers l'arrière, pieds levés ou au sol. Fais pivoter le buste d'un côté à l'autre en touchant le sol de chaque côté." },
{ keys: ['hip thrust'], id: 'Barbell_Hip_Thrust', desc: "Dos calé contre un banc, barre sur les hanches, pousse le bassin vers le haut en contractant les fessiers jusqu'à l'alignement genoux-hanches-épaules, puis redescends." },
{ keys: ['good morning'], id: 'Good_Morning', desc: "Barre sur le haut du dos, jambes légèrement fléchies, penche le buste vers l'avant en gardant le dos plat, jusqu'à sentir l'étirement des ischio-jambiers, puis redresse-toi." },
{ keys: ['marche du fermier','farmer'], id: 'Farmers_Walk', desc: "Saisis une charge lourde dans chaque main et marche en gardant le dos droit, les épaules basses et l'abdomen gainé sur la distance ou le temps prévu." },

const IDB_NAME = 'FitCoachDB';
const IDB_VERSION = 1;
let idbInstancePromise = null;

function initDB() {
  if (idbInstancePromise) return idbInstancePromise;
  idbInstancePromise = new Promise((resolve, reject) => {
    if (!window.indexedDB) { reject(new Error("IndexedDB non supporte par ce navigateur")); return; }
    const request = indexedDB.open(IDB_NAME, IDB_VERSION);
    request.onupgradeneeded = (event) => {
      const db = event.target.result;
      if (!db.objectStoreNames.contains('config')) db.createObjectStore('config');
      if (!db.objectStoreNames.contains('plans')) db.createObjectStore('plans');
      if (!db.objectStoreNames.contains('history')) db.createObjectStore('history');
      if (!db.objectStoreNames.contains('weights')) db.createObjectStore('weights');
    };
    request.onsuccess = (event) => resolve(event.target.result);
    request.onerror = (event) => reject((event.target && event.target.error) || new Error("Erreur ouverture IndexedDB"));
    request.onblocked = () => reject(new Error('Ouverture IndexedDB bloquee (autre onglet ouvert)'));
  });
  return idbInstancePromise;
}

function idbPut(storeName, key, value) {
  return initDB().then((db) => new Promise((resolve, reject) => {
    try {
      const tx = db.transaction(storeName, 'readwrite');
      const store = tx.objectStore(storeName);
      const req = store.put(value, key);
      req.onsuccess = () => resolve(true);
      req.onerror = (e) => reject((e.target && e.target.error) || new Error('Erreur ecriture IndexedDB (' + storeName + ')'));
    } catch (e) { reject(e); }
  }));
}

function idbGet(storeName, key) {
  return initDB().then((db) => new Promise((resolve, reject) => {
    try {
      const tx = db.transaction(storeName, 'readonly');
      const store = tx.objectStore(storeName);
      const req = store.get(key);
      req.onsuccess = () => resolve(req.result !== undefined ? req.result : null);
      req.onerror = (e) => reject((e.target && e.target.error) || new Error('Erreur lecture IndexedDB (' + storeName + ')'));
    } catch (e) { reject(e); }
  }));
}

function idbGetAll(storeName) {
  return initDB().then((db) => new Promise((resolve, reject) => {
    try {
      const tx = db.transaction(storeName, 'readonly');
      const store = tx.objectStore(storeName);
      if (store.getAll) {
        const req = store.getAll();
        req.onsuccess = () => resolve(req.result || []);
        req.onerror = (e) => reject((e.target && e.target.error) || new Error('Erreur lecture IndexedDB (' + storeName + ')'));
      } else {
        const results = [];
        const req = store.openCursor();
        req.onsuccess = (event) => {
          const cursor = event.target.result;
          if (cursor) { results.push(cursor.value); cursor.continue(); }
          else resolve(results);
        };
        req.onerror = (e) => reject((e.target && e.target.error) || new Error('Erreur lecture IndexedDB (' + storeName + ')'));
      }
    } catch (e) { reject(e); }
  }));
}

function idbClearStore(storeName) {
  return initDB().then((db) => new Promise((resolve, reject) => {
    try {
      const tx = db.transaction(storeName, 'readwrite');
      const store = tx.objectStore(storeName);
      const req = store.clear();
      req.onsuccess = () => resolve(true);
      req.onerror = (e) => reject((e.target && e.target.error) || new Error('Erreur suppression IndexedDB (' + storeName + ')'));
    } catch (e) { reject(e); }
  }));
}

function saveConfig(data) { return idbPut('config', 'user', data); }
function loadConfig() { return idbGet('config', 'user').catch((e) => { console.error('loadConfig error', e); return null; }); }
function savePlan(weekNum, planData) { return idbPut('plans', 'week_' + weekNum, planData); }
function loadPlan(weekNum) { return idbGet('plans', 'week_' + weekNum).catch((e) => { console.error('loadPlan error', e); return null; }); }
function saveToHistory(weekEntry) { return idbPut('history', 'week_' + weekEntry.week, weekEntry); }
function loadHistory() { return idbGetAll('history').then((arr) => arr.slice().sort((a, b) => (a.week || 0) - (b.week || 0))).catch((e) => { console.error('loadHistory error', e); return []; }); }
function countLogKeys(obj) { return (obj && typeof obj === 'object') ? Object.keys(obj).length : 0; }
function savePlanSafe(weekNum, planData, allowReset) {
  return loadPlan(weekNum).then((prev) => {
    const prevCount = countLogKeys(prev && prev.logs);
    const nextCount = countLogKeys(planData && planData.logs);
    if (!allowReset && prevCount > 0 && nextCount === 0) {
      console.warn('[FitCoach] Sauvegarde annulee : refus d ecraser ' + prevCount + ' exercice(s) par un plan vide.');
      return 'blocked';
    }
    return savePlan(weekNum, planData);
  });
}
function saveHistorySafe(list, allowReset) {
  return loadHistory().then((prev) => {
    const prevLen = (prev && prev.length) || 0;
    const nextLen = (list && list.length) || 0;
    if (!allowReset && prevLen > 0 && nextLen === 0) {
      console.warn('[FitCoach] Historique preserve : refus d effacer ' + prevLen + ' semaine(s).');
      return 'blocked';
    }
    return idbClearStore('history').then(() => (list || []).reduce((chain, w) => chain.then(() => saveToHistory(w)), Promise.resolve()));
  });
}
function saveWeightEntry(dateStr, weightVal) { return idbPut('weights', dateStr, { date: dateStr, weight: weightVal }).catch((e) => { console.error('saveWeightEntry error', e); }); }
function loadWeights() { return idbGetAll('weights').catch((e) => { console.error('loadWeights error', e); return []; }); }
function deleteAllData() { return Promise.all(['config', 'plans', 'history', 'weights'].map((s) => idbClearStore(s))); }

function idbEntries(storeName) {
  return initDB().then((db) => new Promise((resolve, reject) => {
    try {
      const tx = db.transaction(storeName, 'readonly');
      const store = tx.objectStore(storeName);
      const results = [];
      const req = store.openCursor();
      req.onsuccess = (event) => {
        const cursor = event.target.result;
        if (cursor) { results.push({ key: cursor.key, value: cursor.value }); cursor.continue(); }
        else resolve(results);
      };
      req.onerror = (e) => reject((e.target && e.target.error) || new Error('Erreur lecture IndexedDB (' + storeName + ')'));
    } catch (e) { reject(e); }
  }));
}

const SYNC_STORES = ['config', 'plans', 'history', 'weights'];

function buildSyncSnapshot() {
  return Promise.all(SYNC_STORES.map((s) => idbEntries(s))).then((lists) => {
    const stores = {};
    SYNC_STORES.forEach((s, i) => { stores[s] = lists[i]; });
    (stores.config || []).forEach((entry) => {
      if (entry.value && typeof entry.value === 'object') {
        const clean = Object.assign({}, entry.value);
        delete clean.apiKey;
        entry.value = clean;
      }
    });
    return { version: 1, updatedAt: new Date().toISOString(), stores: stores };
  });
}

function restoreSyncSnapshot(payload) {
  if (!payload || !payload.stores) return Promise.reject(new Error('Sauvegarde en ligne invalide'));
  return idbGet('config', 'user').catch(() => null).then((localCfg) => {
    const localKey = (localCfg && localCfg.apiKey) || localStorage.getItem('apiKey') || '';
    return SYNC_STORES.reduce((chain, s) => chain.then(() => {
      const entries = payload.stores[s] || [];
      return idbClearStore(s).then(() => entries.reduce((c2, e) => c2.then(() => {
        let v = e.value;
        if (s === 'config' && e.key === 'user' && v && typeof v === 'object') { v = Object.assign({}, v, { apiKey: localKey }); }
        return idbPut(s, e.key, v);
      }), Promise.resolve()));
    }), Promise.resolve());
  });
}

function syncRequest(action, code, data, extra) {
  return fetch('/api/data', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    cache: 'no-store',
    body: JSON.stringify(Object.assign({ action: action, code: code, data: data }, extra || {}))
  }).then((r) => r.json().catch(() => ({})).then((j) => ({ status: r.status, body: j || {} })));
}

function syncErrorLabel(status, body) {
  const code = (body && body.error) || '';
  if (status === 503 || code === 'storage_not_configured') return 'La base de donnees n est pas encore branchee sur Vercel.';
  if (code === 'invalid_code') return 'Code de synchronisation invalide (8 caracteres minimum, lettres/chiffres/-/_).';
  if (code === 'too_large') return 'Sauvegarde trop volumineuse.';
  if (status === 404) return 'Route /api/data introuvable (deploiement en cours ?).';
  return 'Erreur de synchronisation (' + (code || status) + ').';
}

const parseTimeToMinutes = (str) => {
if (!str) return 0;
const parts = String(str).split(':').map(p => parseFloat(p)).filter(n => !isNaN(n));
if (parts.length === 0) {
const n = parseFloat(str);
return isNaN(n) ? 0 : n;
}
if (parts.length === 1) return parts[0];
if (parts.length === 2) return parts[0] + parts[1] / 60;
if (parts.length === 3) return parts[0] * 60 + parts[1] + parts[2] / 60;
return 0;
};

const formatPaceFromStats = (distanceKm, timeMin) => {
if (!distanceKm || !timeMin) return '';
const totalSeconds = Math.round((timeMin / distanceKm) * 60);
const m = Math.floor(totalSeconds / 60);
const s = totalSeconds % 60;
return m + ':' + String(s).padStart(2, '0');
};

const computeDayStats = (weekEntry, dayIdx, day) => {
let volume = 0, distance = 0, timeMin = 0, loggedCount = 0;
(day.exercises || []).forEach((ex, exIdx) => {
const log = (weekEntry.logs || {})[dayIdx + '-' + exIdx];
if (!log) return;
const sets = log.series || [];
sets.forEach(s => {
const w = parseFloat(s.weight) || 0;
const r = parseFloat(s.reps) || 0;
if (w && r) volume += w * r;
});
if (log.distance) distance += parseFloat(log.distance) || 0;
if (log.time) timeMin += parseTimeToMinutes(log.time);
if (sets.length > 0 || log.distance || log.time || log.notes) loggedCount++;
});
return {
volume: Math.round(volume),
distance: Math.round(distance * 10) / 10,
timeMin: Math.round(timeMin),
loggedCount
};
};

const getPeriodCutoffDate = (period) => {
const now = new Date();
if (period === 'week') return new Date(now.getTime() - 7 * 24 * 3600 * 1000);
if (period === 'month') return new Date(now.getTime() - 30 * 24 * 3600 * 1000);
if (period === 'year') return new Date(now.getTime() - 365 * 24 * 3600 * 1000);
return null;
};

const computeTotalCalories = (period) => {
const cutoff = getPeriodCutoffDate(period);
let total = 0;
weekHistory.forEach(w => {
if (cutoff && new Date(w.completedAt) < cutoff) return;
Object.values(w.dayCalories || {}).forEach(c => { total += (parseInt(c, 10) || 0); });
});
return total;
};

const estimateCaloriesForDay = async (dayIdx, day, logsObj) => {
const loggedItems = getDayLoggedExercises(day, dayIdx, logsObj);
if (!loggedItems.length) return null;
const dwtForCal = dayWorkoutTimes[dayIdx] || {};
const fallbackDurationSec = dwtForCal.start ? Math.max(0, ((dwtForCal.end ? new Date(dwtForCal.end) : new Date()) - new Date(dwtForCal.start)) / 1000) : 0;
const durationSec = computeDayDurationSeconds(day, dayIdx, logsObj) || fallbackDurationSec;
const durationMin = Math.max(1, Math.round(durationSec / 60));
const details = loggedItems.map((item) => {
const ex = item.ex; const log = item.log;
const parts = [ex.name + ':'];
if (log.series && log.series.length) parts.push(log.series.map(s => (s.weight || '?') + 'kg x ' + (s.reps || '?') + ' reps').join(', '));
if (log.distance) parts.push(log.distance + 'km');
if (log.time) parts.push(log.time);
if (log.heartRate) parts.push('FC moy: ' + log.heartRate + ' bpm');
return parts.join(' ');
}).join(' | ');
const heartRates = loggedItems.map(item => parseFloat(item.log.heartRate)).filter(n => !isNaN(n));
const avgHR = heartRates.length ? Math.round(heartRates.reduce((a, b) => a + b, 0) / heartRates.length) : null;
const userInfo = 'Poids: ' + (userWeight || 'inconnu') + 'kg, Age: ' + (userAge || 'inconnu') + ' ans, Taille: ' + (userHeight || 'inconnu') + 'cm';
const promptParts = ["Estime le nombre de calories brûlées pour cette séance d'entraînement.", 'Type: ' + day.type, 'Durée: ' + durationMin + ' minutes', 'Détails des exercices: ' + details];
if (avgHR) promptParts.push('FC moyenne: ' + avgHR + ' bpm');
promptParts.push('Utilisateur: ' + userInfo);
promptParts.push("Réponds UNIQUEMENT avec un nombre entier représentant les calories estimées, sans texte ni unité additionnelle.");
const prompt = promptParts.join(' ');
const result = await callClaudeAPI([{ role: 'user', content: prompt }], "Tu es un expert en physiologie de l'exercice qui estime des dépenses caloriques de façon réaliste et prudente. Réponds uniquement par un nombre entier, sans aucun texte additionnel.");
if (!result) return null;
const match = result.match(/\d+/);
return match ? parseInt(match[0], 10) : null;
};

const getDayDateStr = (dayEntryLogs, day, dayIdx) => {
  let earliest = null;
  (day.exercises || []).forEach((ex, exIdx) => {
    const log = dayEntryLogs[dayIdx + '-' + exIdx];
    if (!log) return;
    let ts = null;
    if (log.exerciseStartTime) ts = log.exerciseStartTime;
    else if (log.series && log.series.length && log.series[0].timestamp) ts = log.series[0].timestamp;
    if (!ts) return;
    const d = new Date(ts);
    if (isNaN(d.getTime())) return;
    if (!earliest || d < earliest) earliest = d;
  });
  return earliest ? localDateStr(earliest) : null;
};

const buildCalendarEntries = () => {
  const map = {};
  const addWeek = (weekEntry, isCurrent) => {
    (weekEntry.plan.days || []).forEach((day, dayIdx) => {
      const dateStr = getDayDateStr(weekEntry.logs || {}, day, dayIdx);
      if (!dateStr) return;
      const stats = computeDayStats(weekEntry, dayIdx, day);
      if (stats.loggedCount === 0) return;
      if (!map[dateStr]) map[dateStr] = [];
      map[dateStr].push({ week: weekEntry.week, dayIdx: dayIdx, day: day, stats: stats, isCurrent: !!isCurrent });
    });
  };
  weekHistory.forEach((w) => addWeek(w, false));
  if (currentWeekPlan) addWeek({ week: currentWeekPlan.week, plan: currentWeekPlan, logs: logs }, true);
  return map;
};

const buildCalendarGrid = (year, month) => {
  const firstOfMonth = new Date(year, month, 1);
  const daysInMonth = new Date(year, month + 1, 0).getDate();
  const daysInPrevMonth = new Date(year, month, 0).getDate();
  let firstWeekday = firstOfMonth.getDay();
  firstWeekday = (firstWeekday + 6) % 7;
  const cells = [];
  for (let i = firstWeekday - 1; i >= 0; i--) {
    const dayNum = daysInPrevMonth - i;
    const m = month === 0 ? 11 : month - 1;
    const y = month === 0 ? year - 1 : year;
    cells.push({ day: dayNum, month: m, year: y, current: false });
  }
  for (let d = 1; d <= daysInMonth; d++) {
    cells.push({ day: d, month: month, year: year, current: true });
  }
  let nextDay = 1;
  while (cells.length % 7 !== 0) {
    const m = month === 11 ? 0 : month + 1;
    const y = month === 11 ? year + 1 : year;
    cells.push({ day: nextDay, month: m, year: y, current: false });
    nextDay++;
  }
  return cells;
};

const computeMonthStats = (calendarEntries, year, month) => {
  let sessions = 0, volume = 0, distance = 0, timeMin = 0;
  Object.keys(calendarEntries).forEach((dateStr) => {
    const parts = dateStr.split('-');
    const y = parseInt(parts[0], 10);
    const m = parseInt(parts[1], 10) - 1;
    if (y === year && m === month) {
      calendarEntries[dateStr].forEach((e) => {
        sessions += 1;
        volume += e.stats.volume;
        distance += e.stats.distance;
        timeMin += e.stats.timeMin;
      });
    }
  });
  return { sessions: sessions, volume: Math.round(volume), distance: Math.round(distance * 10) / 10, timeMin: Math.round(timeMin) };
};

const names = (day.exercises || []).map(e => normalizeText(e.name)).join(' | ');

const push = count(['developpe','pompe','push','dips','triceps','epaule','militaire','ecarte','pec']);
const pull = count(['rowing','traction','pull','tirage','curl','biceps','row','dorsaux']);
const legs = count(['squat','fente','lunge','presse','leg press','mollet','calf','souleve de terre','deadlift','hip thrust','jambe','ischio','fessier']);

};

const buildTrainingContextText = () => {

lines.push('HISTORIQUE REEL DES DERNIERES SEMAINES');
hist.forEach((w) => {
let vol = 0;
try { vol = computeWeekTotalVolume(w); } catch (e) { vol = 0; }
const nbDays = (w.plan && w.plan.days) ? w.plan.days.length : 0;
const details = [];
Object.entries(w.logs || {}).forEach(([key, val]) => {
const p = key.split('-').map(Number);

const ex = (day && day.exercises) ? day.exercises[p[1]] : null;

const bits = [];
if (val.series && val.series.length) {

}
if (val.distance) bits.push(val.distance + 'km');
if (val.time) bits.push(val.time);
if (val.allure) bits.push('allure ' + val.allure);
if (val.heartRate) bits.push('FC ' + val.heartRate + ' bpm');
if (val.notes) bits.push('note: ' + val.notes);
if (bits.length) details.push(ex.name + ' (' + bits.join(' / ') + ')');
});
lines.push('- Semaine ' + w.week + ': ' + nbDays + ' seances prevues, volume ' + Math.round(vol) + ' kg' + (details.length ? ' | ' + details.join(' ; ') : ' | aucune donnee saisie'));
});
} else {
lines.push('');
lines.push('HISTORIQUE: aucune semaine terminee pour le moment.');
}
const curKeys = Object.keys(logs || {});
if (currentWeekPlan && curKeys.length) {
const curDetails = [];
curKeys.forEach((key) => {
const p = key.split('-').map(Number);
const day = currentWeekPlan.days ? currentWeekPlan.days[p[0]] : null;
const ex = (day && day.exercises) ? day.exercises[p[1]] : null;
const val = logs[key] || {};
if (!ex) return;
const bits = [];
if (val.series && val.series.length) bits.push(val.series.map((s) => (s.weight || '-') + 'kg x ' + (s.reps || '-') + ' reps').join(', '));
if (val.distance) bits.push(val.distance + 'km');
if (val.time) bits.push(val.time);
if (val.allure) bits.push('allure ' + val.allure);
if (val.notes) bits.push('note: ' + val.notes);
if (bits.length) curDetails.push(ex.name + ': ' + bits.join(' / '));
});
if (curDetails.length) {
lines.push('');

}
}
const progEntries = Object.entries(exerciseProgression || {});
if (progEntries.length) {

const buildPrepSystem = () => {
const rules = [
'REGLES DE LA DISCUSSION:',
'1) Parle en francais, ton chaleureux et direct, phrases courtes.',
'2) Pose UNE seule question a la fois, 4 questions maximum au total. Cible uniquement ce qui change vraiment le plan: forme et fatigue du moment, courbatures ou douleurs, priorite de la semaine, contraintes de temps ou de lieu, envie ou lassitude sur certains exercices.',
'3) Ne repose jamais une question dont la reponse figure deja dans le profil ou l historique ci-dessus. Appuie-toi dessus et montre-le brievement (rappelle par exemple une charge atteinte ou un volume).',
'4) A la fin de CHAQUE message, propose 2 a 4 reponses rapides dans ce bloc technique exact: [SUGGESTIONS]reponse 1|reponse 2|reponse 3[/SUGGESTIONS]',
'5) Des que tu as assez d informations, resume en 3 a 5 puces ce que tu vas mettre dans la semaine (types de seances, priorites, charges visees), puis termine ton message par le marqueur [PRET].',
"6) Ne genere JAMAIS le plan toi-meme et n ecris jamais de JSON: c est le bouton de l application qui declenche la generation.",
'7) Ne mentionne jamais les marqueurs techniques a l utilisateur.'
].join('\n');
return "Tu es un coach sportif expert. Tu discutes avec ton athlete pour preparer sa prochaine semaine d entrainement AVANT que l application ne genere le plan. Ton but est de recueillir les 2 ou 3 informations qui manquent pour rendre le plan vraiment personnalise.\n\n" + buildTrainingContextText() + '\n\n' + rules;
};

const parsePrepReply = (raw) => {
let text = String(raw || '');
let chips = [];
const m = text.match(/\[SUGGESTIONS\]([\s\S]*?)\[\/SUGGESTIONS\]/);
if (m) {
text = text.replace(m[0], '').trim();
chips = m[1].split('|').map((s) => s.trim()).filter(Boolean).slice(0, 4);
}
let ready = false;
if (text.indexOf('[PRET]') !== -1) {
ready = true;
text = text.split('[PRET]').join('').trim();
}
return { text: text, chips: chips, ready: ready };
};

setWeekHistory(prev => prev.filter((_, i) => i !== idx));
};

const deleteDayFromWeek = (weekIdx, dayIdx) => {
if (!window.confirm('Supprimer cette séance de ton historique ? Cette action est irréversible.')) return;
setWeekHistory(prev => prev.map((w, i) => {
if (i !== weekIdx) return w;
const newDays = (w.plan.days || []).filter((_, di) => di !== dayIdx);
const newLogs = {};
Object.entries(w.logs || {}).forEach(([key, val]) => {
const parts = key.split('-').map(Number);
const d = parts[0], e = parts[1];
if (d === dayIdx) return;
const newD = d > dayIdx ? d - 1 : d;
newLogs[newD + '-' + e] = val;
});
return { ...w, plan: { ...w.plan, days: newDays }, logs: newLogs };
}));
};

const deleteExerciseLog = (weekIdx, dayIdx, exIdx) => {
if (!window.confirm('Supprimer les données de cet exercice complété ? Cette action est irréversible.')) return;
setWeekHistory(prev => prev.map((w, i) => {
if (i !== weekIdx) return w;
const newLogs = { ...(w.logs || {}) };
delete newLogs[dayIdx + '-' + exIdx];
return { ...w, logs: newLogs };
}));
};

const formatSyncDate = (iso) => {
if (!iso) return '\u2014';
try {
const d = new Date(iso);
return d.toLocaleDateString('fr-CA') + ' ' + d.toLocaleTimeString('fr-CA', { hour: '2-digit', minute: '2-digit' });
} catch (e) { return iso; }
};

const markSynced = (iso) => {
const v = iso || new Date().toISOString();
localStorage.setItem('fitcoachSyncedAt', v);
setLastSyncAt(v);
};

const pushSync = (mode, force) => {
if (!syncCode) return Promise.resolve(false);
setSyncState('saving');
return buildSyncSnapshot().then((snap) => syncRequest('set', syncCode, snap, force ? { force: true } : null).then((r) => {
if (r.status === 200 && r.body && r.body.ok) {
markSynced(snap.updatedAt);
setSyncState('saved');
setSyncInfo('');
if (mode === 'manual') setMessage('\u2601\ufe0f Donnees sauvegardees en ligne');
return true;
}
if (r.status === 409) {
const nb = (r.body && r.body.current && r.body.current.exercises) || 0;
const warn = 'Sauvegarde bloquee : le serveur contient ' + nb + ' exercice(s) alors que cet appareil n en a aucun.';
setSyncState('error');
setSyncInfo(warn);
if (mode === 'manual') {
if (window.confirm(warn + ' Veux-tu quand meme ecraser la sauvegarde en ligne ?')) return pushSync('manual', true);
setMessage('Sauvegarde en ligne conservee.');
} else {
setMessage('\u26a0\ufe0f ' + warn + ' Utilise Restaurer depuis le serveur si tes donnees ont disparu.');
}
return false;
}
setSyncState('error');
setSyncInfo(syncErrorLabel(r.status, r.body));
if (mode === 'manual') setMessage('\u26a0\ufe0f ' + syncErrorLabel(r.status, r.body));
return false;
})).catch((e) => {
setSyncState('error');
setSyncInfo('Erreur: ' + (e.message || e));
return false;
});
};

const pullSync = (mode) => {
if (!syncCode) return Promise.resolve(false);
setSyncState('loading');
return syncRequest('get', syncCode, null).then((r) => {
if (r.status !== 200 || !r.body || !r.body.ok) {
setSyncState('error');
setSyncInfo(syncErrorLabel(r.status, r.body));
if (mode === 'manual') setMessage('\u26a0\ufe0f ' + syncErrorLabel(r.status, r.body));
return false;
}
const remote = r.body.data;
if (!remote || !remote.stores) {
setSyncState('idle');
setSyncInfo('Aucune sauvegarde en ligne pour ce code pour le moment.');
if (mode === 'manual') setMessage('Aucune sauvegarde en ligne trouvee pour ce code');
return false;
}
const localSynced = localStorage.getItem('fitcoachSyncedAt') || '';
if (mode === 'auto' && localSynced && remote.updatedAt && remote.updatedAt <= localSynced) {
setSyncState('saved');
return false;
}
if (mode === 'manual' && !window.confirm('Remplacer les donnees de cet appareil par la sauvegarde en ligne du ' + formatSyncDate(remote.updatedAt) + ' ?')) return false;
return restoreSyncSnapshot(remote).then(() => {
markSynced(remote.updatedAt);
setSyncState('saved');
setMessage('\u2601\ufe0f Donnees restaurees depuis le serveur \u2014 rechargement...');
setTimeout(() => window.location.reload(), 800);
return true;
});
}).catch((e) => {
setSyncState('error');
setSyncInfo('Erreur: ' + (e.message || e));
return false;
});
};

const saveSyncCode = () => {
const c = (syncCodeInput || '').trim();
if (!c) {
localStorage.removeItem('fitcoachSyncCode');
setSyncCode('');
setSyncState('idle');
setSyncInfo('');
setMessage('Sauvegarde en ligne desactivee sur cet appareil');
return;
}
if (!/^[A-Za-z0-9_-]{8,64}$/.test(c)) {
setMessage('\u26a0\ufe0f Code invalide : 8 caracteres minimum, lettres, chiffres, - ou _');
return;
}
localStorage.setItem('fitcoachSyncCode', c);
setSyncCode(c);
setSyncPulled(false);
setSyncInfo('');
setMessage('\u2705 Code enregistre \u2014 sauvegarde en ligne activee');
};

const chars = 'abcdefghijkmnopqrstuvwxyz23456789';
let s = '';
for (let i = 0; i < 14; i++) s += chars.charAt(Math.floor(Math.random() * chars.length));
setSyncCodeInput('fit-' + s);
};

setSyncPulled(true);
pullSync('auto');

else { setSyncState('error'); setSyncInfo(syncErrorLabel(r.status, r.body)); }
}).catch((e) => { setSyncState('error'); setSyncInfo('Erreur: ' + (e.message || e)); });
};

const restoreSyncVersion = (idx) => {
if (!syncCode) return;
if (!window.confirm('Restaurer cette sauvegarde precedente ? Les donnees actuelles de cet appareil seront remplacees.')) return;
setSyncState('loading');
syncRequest('getVersion', syncCode, null, { index: idx }).then((r) => {
if (r.status !== 200 || !r.body || !r.body.ok || !r.body.data) { setSyncState('error'); setSyncInfo(syncErrorLabel(r.status, r.body)); return null; }
return restoreSyncSnapshot(r.body.data).then(() => { setMessage('Sauvegarde precedente restauree'); setTimeout(() => window.location.reload(), 800); });
}).catch((e) => { setSyncState('error'); setSyncInfo('Erreur: ' + (e.message || e)); });
};

  const wipeServer = codeToWipe

    : Promise.resolve('none');
  wipeServer.then((serverResult) => deleteAllData().then(() => {

    setSelectedPlanDay(0);
    setAllowExtraSet(false);
    localStorage.removeItem('fitcoach_idb_migrated');
    setCurrentTab('setup');
    if (serverResult === 'ok') setMessage('Toutes tes donnees ont ete supprimees (appareil + sauvegarde en ligne)');
    else if (serverResult === 'fail') setMessage('Donnees supprimees sur cet appareil, mais la sauvegarde en ligne n a pas pu etre effacee. Reessaie plus tard.');

const isOpen = !!expandedWorkouts[cardKey];
return (
<div className="workout-card" key={dayIdx} role="button" tabIndex={0} onClick={() => toggleWorkout(cardKey)} onKeyDown={(e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); toggleWorkout(cardKey); } }}>
<div className="workout-card-header">
<div className="workout-card-header-left">
<span className="workout-card-icon">{typeIcon(day.type)}</span>
<span><strong>{day.day}</strong> <span className="workout-card-daytype">— {day.type}</span></span>
</div>
<div className="workout-card-header-right">
<button className="btn-delete-day" aria-label="Supprimer cette séance" onClick={(e) => { e.stopPropagation(); deleteDayFromWeek(wIdx, dayIdx); }} title="Supprimer cette séance">🗑️</button>
<span className="chevron">{isOpen ? '▾' : '▸'}</span>
</div>
</div>
<div className="workout-card-summary">{summaryLine(day, stats)}{w.dayCalories && w.dayCalories[dayIdx] != null ? (' · 🔥 ' + w.dayCalories[dayIdx] + ' kcal') : ''}</div>
{isOpen && (
<div className="workout-card-body" onClick={(e) => e.stopPropagation()}>
{(day.exercises || []).map((ex, exIdx) => {
const log = (w.logs || {})[dayIdx + '-' + exIdx] || {};
const logSets = log.series || [];
const hasLog = logSets.length > 0 || log.distance || log.time || log.notes;
if (!hasLog) return null;
let maxW = 0;
logSets.forEach(s => { const wt = parseFloat(s.weight) || 0; if (wt > maxW) maxW = wt; });
return (
<div key={exIdx} className="history-exercise-row">
<div style={{flex: 1}}>
<div className="workout-card-exercise-name">{ex.name}</div>
<div className="hist-actions">
<button type="button" className="hist-icon-btn" title="Modifier les resultats" onClick={() => openEditLog('archive', wIdx, dayIdx, exIdx, ex.name, log)}>✏️ Modifier</button>
<button type="button" className="hist-icon-btn danger" title="Supprimer cet exercice de l historique" onClick={() => deleteLogEntry('archive', wIdx, dayIdx, exIdx, ex.name)}>🗑️ Supprimer</button>
</div>
<div className="workout-card-exercise-detail">
{'Prévu: ' + ex.sets + ' x ' + ex.reps + (ex.weight ? (' @ ' + ex.weight) : '')}
{hasLog && (
<React.Fragment><br />
{'Réalisé: '}
{logSets.length > 0 ? (logSets.map((s, si) => (s.weight || '?') + 'kg x ' + (s.reps || '?') + ' reps').join(', ') + ' ') : ''}
{log.distance ? (log.distance + 'km ') : ''}
{log.time ? (log.time + ' ') : ''}
{log.allure ? ('· ' + log.allure + ' min/km ') : ''}
{log.heartRate ? ('· FC moy ' + log.heartRate + 'bpm ') : ''}
{log.notes ? ('— "' + log.notes + '"') : ''}
</React.Fragment>
)}
{maxW > 0 && (<React.Fragment><br />{'💡 max ' + maxW + 'kg → semaine suivante proposé ' + proposeNextWeight(maxW) + 'kg'}</React.Fragment>)}
</div>
</div>
{hasLog && (
<button className="btn-delete-exercise" aria-label="Supprimer cet exercice" onClick={(e) => { e.stopPropagation(); deleteExerciseLog(wIdx, dayIdx, exIdx); }} title="Supprimer cet exercice complété">🗑️</button>
)}
</div>
);
})}
<div className="workout-card-total">{totalLine(day, stats)}{w.dayCalories && w.dayCalories[dayIdx] != null ? (' · 🔥 ' + w.dayCalories[dayIdx] + ' kcal') : ''}</div>
</div>
)}
</div>
);
})}
</div>
))}
</div>
)}
</div>
)}

</div>
{exerciseModal && (() => {
const info = getExerciseInfo(exerciseModal.name);
const imgSrc = info && info.id ? (EXERCISE_IMAGE_BASE + info.id + '/' + modalFrame + '.jpg') : null;
const ytUrl = 'https://www.youtube.com/results?search_query=' + encodeURIComponent(exerciseModal.name + ' technique tutoriel exercice');
return (
<div className="modal-overlay" onClick={() => setExerciseModal(null)}>
<div className="modal-box" onClick={(e) => e.stopPropagation()}>
<div className="modal-header">
<h3>{exerciseModal.name}</h3>
<button className="modal-close" aria-label="Fermer" onClick={() => setExerciseModal(null)}>✕</button>
</div>
<div className="modal-media">
{imgSrc ? (
<img src={imgSrc} alt={exerciseModal.name} onError={(e) => { e.target.style.display = 'none'; }} />
) : (
<div className="modal-media-fallback">🎥<br />Démo visuelle non disponible pour cet exercice</div>
)}
</div>
<p className="modal-desc">{info ? info.desc : "Description détaillée non disponible pour cet exercice. Consulte la vidéo ci-dessous pour la technique correcte."}</p>
<a className="btn-video" href={ytUrl} target="_blank" rel="noopener noreferrer">▶️ Voir des vidéos explicatives sur YouTube</a>
</div>
</div>
);
})()}
{logModal && (() => {
const info = getExerciseInfo(logModal.name);
const key = logModal.dayIdx + '-' + logModal.exIdx;
const logged = logs[key] || {};
const sets = logged.series || [];
const targetSets = parseInt(logModal.sets, 10) || 0;
const setsExceeded = targetSets > 0 && sets.length >= targetSets && !allowExtraSet;
const imgSrc = info && info.id ? (EXERCISE_IMAGE_BASE + info.id + '/' + logModalFrame + '.jpg') : null;
const typeNorm = normalizeText(logModal.type || '');
const isMixedType = /crossfit|wod|mixte/.test(typeNorm);
const isCardioOnly = !isMixedType && /cardio|running|course|velo|cycl|rando|hike|marche/.test(typeNorm);
const showStrengthFields = isMixedType || !isCardioOnly;
const showCardioFields = isMixedType || isCardioOnly;
const showHeartRateField = isMixedType || isCardioOnly;
const computeTimeFromPace = (distanceVal, paceVal) => {
const dist = parseFloat(distanceVal);
const paceMin = parseTimeToMinutes(paceVal);
if (!dist || dist <= 0 || !paceMin || paceMin <= 0) return '';
const totalSeconds = Math.round(dist * paceMin * 60);
const m = Math.floor(totalSeconds / 60);
const s = totalSeconds % 60;
return m + ':' + String(s).padStart(2, '0');
};
const computeAllureStr = (distanceVal, timeVal) => {
const dist = parseFloat(distanceVal);
const timeMin = parseTimeToMinutes(timeVal);
if (!dist || dist <= 0 || !timeMin || timeMin <= 0) return '';
const totalSeconds = Math.round((timeMin / dist) * 60);
const m = Math.floor(totalSeconds / 60);
const s = totalSeconds % 60;
return m + ':' + String(s).padStart(2, '0');
};
const exerciseElapsedSec = logged.exerciseStartTime ? Math.max(0, Math.round(((logged.exerciseEndTime ? new Date(logged.exerciseEndTime) : new Date()) - new Date(logged.exerciseStartTime)) / 1000)) : null;
return (
<div className="modal-overlay" onClick={backFromLogModal}>
<div className="modal-box" onClick={(e) => e.stopPropagation()}>
<div className="modal-header">
<h3>{logModal.name}</h3>
<button className="modal-close" aria-label="Retour sans terminer" title="Retour — les donnees saisies sont conservees" onClick={backFromLogModal}>✕</button>
</div>
<div className="modal-media">
{imgSrc ? (
<img src={imgSrc} alt={logModal.name} onError={(e) => { e.target.style.display = 'none'; }} />
) : (
<div className="modal-media-fallback">🎥<br />Démo visuelle non disponible pour cet exercice</div>
)}
</div>
{showStrengthFields && sets.length > 0 && (
<div className="sets-recorded-list">
{sets.map((s, si) => (
<div key={si} className="set-recorded-row">
<span>{'Série ' + (si + 1)}</span>
<span>{(s.weight || '?') + ' kg x ' + (s.reps || '?') + ' reps'}</span>
</div>
))}
</div>
)}
{showStrengthFields && setsExceeded && (
<div className="extra-set-box">
<p>{'✅ Tu as complété les ' + targetSets + ' séries prévues par le programme (' + sets.length + ' enregistrée' + (sets.length > 1 ? 's' : '') + '). Tu peux passer à l\'autre exercice ou ajouter un set supplémentaire.'}</p>
<div className="extra-set-actions">
<button type="button" onClick={() => goToNextExercise(logModal.dayIdx, logModal.exIdx)}>⏭️ Passer à l'autre exercice</button>
<button type="button" className="btn-secondary" onClick={() => setAllowExtraSet(true)}>➕ Ajouter un set supplémentaire</button>
</div>
</div>
)}
{showStrengthFields && !setsExceeded && (
<div className="set-input-row">
<label>{'Série ' + (sets.length + 1) + (targetSets > 0 ? ((sets.length + 1) > targetSets ? ' (supplémentaire)' : ' / ' + targetSets) : '')}</label>
<div className="set-input-fields">
<input type="number" inputMode="decimal" step="0.5" aria-label="Poids en kilogrammes" placeholder="Poids (kg)" value={currentSetWeight} onChange={(e) => setCurrentSetWeight(e.target.value)} />
<input type="number" inputMode="numeric" step="1" aria-label="Nombre de répétitions" placeholder="Reps" value={currentSetReps} onChange={(e) => setCurrentSetReps(e.target.value)} />
</div>
<button type="button" onClick={saveSet}>💾 ENREGISTRER SÉRIE</button>
{seriesFeedback && <p className="series-feedback">Série enregistrée ✓</p>}
{restTimer ? (
<div style={{textAlign: 'center', marginTop: '12px'}}>
{restTimer.running ? (
<React.Fragment>
<div className="session-timer-display rest-timer-count" style={{color: 'var(--red)'}}>{'⏳ Pause: ' + formatMMSS(restTimer.secondsLeft)}</div>
<button type="button" className="btn-secondary" style={{marginTop: '8px', width: 'auto', padding: '6px 14px', fontSize: '12px'}} onClick={() => setRestTimer(null)}>Passer la pause</button>
</React.Fragment>
) : (
<div style={{color: 'var(--green)', fontWeight: 700}}>Pause terminée ✓</div>
)}
</div>
) : (
<div style={{marginTop: '12px'}}>
<p style={{fontSize: '12px', color: 'var(--text-dim)', marginBottom: '6px'}}>Pause ?</p>
<div style={{display: 'flex', gap: '8px'}}>
{[30, 60, 90, 120].map(sec => (
<button key={sec} type="button" className="btn-secondary" style={{width: 'auto', flex: 1, padding: '8px', fontSize: '12px'}} onClick={() => startRestTimer(sec)}>{sec + 's'}</button>
))}
</div>
</div>
)}
{exerciseElapsedSec != null && (
<p style={{fontSize: '12px', color: 'var(--text-dim)', marginTop: '10px'}}>{'⏱️ Durée calc: ' + formatMMSS(exerciseElapsedSec)}</p>
)}
</div>
)}
<div className="optional-extra-fields">
{showCardioFields && (
<React.Fragment>
<p className="section-title" style={{fontSize: '13px', marginTop: '4px'}}>Détails de la séance</p>
<input type="number" aria-label="Distance en kilomètres" placeholder="Distance (km)" value={logged.distance || ''} onChange={(e) => {
const d = e.target.value;
if (logged.allureManual && logged.allure) {
logExercise(logModal.dayIdx, logModal.exIdx, {distance: d, time: computeTimeFromPace(d, logged.allure) || logged.time});
} else {
logExercise(logModal.dayIdx, logModal.exIdx, {distance: d, allure: computeAllureStr(d, logged.time)});
}
}} />
<input type="text" aria-label="Temps de la séance" placeholder="Temps (ex: 30:45)" value={logged.time || ''} onChange={(e) => logExercise(logModal.dayIdx, logModal.exIdx, {time: e.target.value, allure: computeAllureStr(logged.distance, e.target.value), allureManual: false})} />
<input type="text" inputMode="numeric" aria-label="Allure en minutes par kilomètre" placeholder="Allure / pace (min:sec par km, ex: 5:30)" value={logged.allure || ''} onChange={(e) => {
const p = e.target.value;
const t = computeTimeFromPace(logged.distance, p);
logExercise(logModal.dayIdx, logModal.exIdx, t ? {allure: p, allureManual: true, time: t} : {allure: p, allureManual: true});
}} />
{logged.allure && (<p style={{fontSize: '12px', color: 'var(--orange-light)', margin: '-6px 0 10px'}}>{'🏃 Allure: ' + logged.allure + ' min/km' + (logged.allureManual ? ' (saisie manuelle)' : ' (calculée)')}</p>)}
{!logged.allure && (<p style={{fontSize: '11.5px', color: 'var(--text-dim)', margin: '-6px 0 10px'}}>💡 L'allure se calcule toute seule si tu remplis distance + temps, ou tu peux l'inscrire directement.</p>)}
</React.Fragment>
)}
{showHeartRateField && (
<input type="number" aria-label="Fréquence cardiaque moyenne" placeholder="FC moyenne (bpm) - optionnel" value={logged.heartRate || ''} onChange={(e) => logExercise(logModal.dayIdx, logModal.exIdx, {heartRate: e.target.value})} />
)}
<p className="section-title" style={{fontSize: '13px', marginTop: (showCardioFields || showHeartRateField) ? '10px' : '14px'}}>Notes</p>
<textarea aria-label="Notes sur la séance" placeholder="Notes (sensation, difficulté...)" value={logged.notes || ''} onChange={(e) => logExercise(logModal.dayIdx, logModal.exIdx, {notes: e.target.value})} />
</div>
<button type="button" className="btn-secondary" style={{marginTop: '12px'}} onClick={closeLogModal}>🏁 TERMINER CET EXERCICE</button>
</div>
</div>
);
})()}
{editLog && (
<div className="modal-overlay" onClick={() => setEditLog(null)}>
<div className="modal-box" onClick={(e) => e.stopPropagation()}>
<div className="modal-header">
<h3>{'\u270f\ufe0f ' + editLog.name}</h3>
<button className="modal-close" aria-label="Fermer" onClick={() => setEditLog(null)}>✕</button>
</div>
<p style={{fontSize: '12px', color: 'var(--text-dim)', marginBottom: '12px'}}>Corrige tes resultats puis enregistre. Une serie laissee vide est retiree.</p>
<label style={{fontSize: '13px', display: 'block', marginBottom: '8px'}}>🏋️ Series (kg x reps)</label>
{editLog.series.map((s, si) => (
<div key={si} className="edit-series-row">
<span>{'Serie ' + (si + 1)}</span>
<input type="number" inputMode="decimal" placeholder="kg" value={s.weight} onChange={(e) => updateEditSeries(si, 'weight', e.target.value)} />
<input type="number" inputMode="numeric" placeholder="reps" value={s.reps} onChange={(e) => updateEditSeries(si, 'reps', e.target.value)} />
<button type="button" className="hist-icon-btn danger" title="Retirer cette serie" onClick={() => removeEditSeries(si)}>🗑️</button>
</div>
))}
<button type="button" className="link-btn" onClick={addEditSeries}>➕ Ajouter une serie</button>
<div className="form-group" style={{marginTop: '14px'}}>
<label>🏃 Distance (km)</label>
<input type="text" value={editLog.distance} onChange={(e) => setEditLog({ ...editLog, distance: e.target.value })} placeholder="Ex: 5" />
</div>
<div className="form-group">
<label>⏱️ Temps (mm:ss)</label>
<input type="text" value={editLog.time} onChange={(e) => setEditLog({ ...editLog, time: e.target.value })} placeholder="Ex: 27:30" />
</div>
<div className="form-group">
<label>⚡ Allure (min:sec par km)</label>
<input type="text" value={editLog.allure} onChange={(e) => setEditLog({ ...editLog, allure: e.target.value })} placeholder="Ex: 5:30" />
</div>
<div className="form-group">
<label>❤️ FC moyenne (bpm)</label>
<input type="text" value={editLog.heartRate} onChange={(e) => setEditLog({ ...editLog, heartRate: e.target.value })} placeholder="Ex: 145" />
</div>
<div className="form-group">
<label>📝 Notes</label>
<textarea rows="2" value={editLog.notes} onChange={(e) => setEditLog({ ...editLog, notes: e.target.value })} placeholder="Ressenti, remarques..." />
</div>
<button type="button" onClick={saveEditLog}>💾 Enregistrer les modifications</button>
<button type="button" className="btn-secondary" style={{marginTop: '8px'}} onClick={() => setEditLog(null)}>Annuler</button>
<button type="button" className="hist-icon-btn danger" style={{marginTop: '12px', width: '100%', padding: '9px'}} onClick={() => deleteLogEntry(editLog.scope, editLog.weekIdx, editLog.dayIdx, editLog.exIdx, editLog.name)}>🗑️ Supprimer cet exercice de l historique</button>
</div>
</div>
)}

{exerciseSummary && (
<div className="modal-overlay" onClick={() => setExerciseSummary(null)}>
<div className="modal-box" onClick={(e) => e.stopPropagation()} style={{textAlign: 'center'}}>
<h3 style={{marginBottom: '10px'}}>✅ Exercice terminé</h3>
<p style={{marginBottom: '6px'}}>{exerciseSummary.name}</p>
<p style={{marginBottom: '6px'}}>{'Séries: ' + exerciseSummary.seriesCount}</p>
<p>{exerciseSummary.durationSec != null ? ('Durée: ' + formatMMSS(exerciseSummary.durationSec)) : ''}</p>
</div>
</div>
)}
{sessionSummary && (
<div className="modal-overlay" onClick={() => setSessionSummary(null)}>
<div className="modal-box" onClick={(e) => e.stopPropagation()} style={{textAlign: 'center'}}>
<h3 style={{marginBottom: '10px'}}>🔥 Calories estimées</h3>
{sessionSummary.days.map((d, i) => (<p key={i} style={{marginBottom: '6px'}}>{d.name + ': ' + d.calories + ' kcal'}</p>))}
<button type="button" className="btn-secondary" style={{marginTop: '10px'}} onClick={() => setSessionSummary(null)}>Fermer</button>
</div>
</div>
)}
</div>
);
}

ReactDOM.render(<FitCoachApp />, document.getElementById('root'));
</script>
</body>
</html>
