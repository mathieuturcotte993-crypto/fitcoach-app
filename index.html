<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FitCoach - Votre App d'Entraînement</title>
<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@600;700&family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
* {
margin: 0;
padding: 0;
box-sizing: border-box;
}

:root {
--bg-0: #08080a;
--bg-1: #0f0f13;
--surface: #16161c;
--surface-2: #1c1c24;
--surface-3: #222229;
--border: #2a2a33;
--orange: #ff7a1a;
--orange-light: #ffab5e;
--orange-dark: #c9500a;
--text: #f2f2f4;
--text-dim: #9a9aa6;
--green: #4cd964;
--red: #ff5c5c;
}

body {
font-family: 'Poppins', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
background: radial-gradient(circle at 50% 0%, #1a1208 0%, var(--bg-0) 55%);
background-attachment: fixed;
min-height: 100vh;
color: var(--text);
padding: 10px;
}

.app {
max-width: 600px;
margin: 0 auto;
background: var(--bg-1);
border: 1px solid var(--border);
border-radius: 16px;
box-shadow: 0 0 50px rgba(255,122,26,0.08), 0 20px 40px rgba(0,0,0,0.55);
overflow: hidden;
}

.header {
background: linear-gradient(160deg, #1a1712 0%, #0c0c0f 70%);
color: var(--text);
padding: 26px 20px;
text-align: center;
border-bottom: 1px solid var(--border);
position: relative;
}

.header::after {
content: '';
position: absolute;
left: 0; right: 0; bottom: -1px;
height: 3px;
background: linear-gradient(90deg, transparent, var(--orange), var(--orange-light), var(--orange), transparent);
}

.header h1 {
font-family: 'Rajdhani', sans-serif;
font-size: 32px;
letter-spacing: 1px;
font-weight: 700;
margin-bottom: 4px;
color: var(--text);
text-shadow: 0 0 18px rgba(255,122,26,0.45);
}

.header p {
color: var(--text-dim);
font-size: 13px;
letter-spacing: 0.5px;
}

.content {
padding: 20px;
}

.tab-buttons {
display: flex;
gap: 6px;
margin-bottom: 20px;
border-bottom: 1px solid var(--border);
}

.tab-btn {
flex: 1;
padding: 10px 4px;
border: none;
background: none;
cursor: pointer;
font-size: 12px;
font-weight: 600;
color: var(--text-dim);
border-bottom: 3px solid transparent;
transition: all 0.25s;
font-family: 'Poppins', sans-serif;
}

.tab-btn:hover {
color: var(--orange-light);
}

.tab-btn.active {
color: var(--orange);
border-bottom-color: var(--orange);
text-shadow: 0 0 12px rgba(255,122,26,0.35);
}

.form-group {
margin-bottom: 15px;
}

label {
display: block;
margin-bottom: 5px;
font-weight: 600;
color: var(--text);
font-size: 14px;
}

input, select, textarea {
width: 100%;
padding: 10px;
border: 1px solid var(--border);
border-radius: 8px;
font-size: 14px;
font-family: inherit;
background: var(--surface-2);
color: var(--text);
}

textarea {
resize: vertical;
min-height: 80px;
}

input::placeholder, textarea::placeholder {
color: #6f6f7a;
}

input:focus, select:focus, textarea:focus {
outline: none;
border-color: var(--orange);
box-shadow: 0 0 0 3px rgba(255,122,26,0.15);
}

button {
background: linear-gradient(135deg, var(--orange) 0%, var(--orange-light) 100%);
color: #17120a;
padding: 12px 24px;
border: none;
border-radius: 8px;
font-size: 14px;
font-weight: 700;
cursor: pointer;
transition: transform 0.2s, box-shadow 0.2s;
width: 100%;
font-family: 'Poppins', sans-serif;
box-shadow: 0 4px 16px rgba(255,122,26,0.3);
}

button:hover:not(:disabled) {
transform: translateY(-2px);
box-shadow: 0 6px 22px rgba(255,122,26,0.45);
}

button:active:not(:disabled) {
transform: translateY(0);
}

button:disabled {
opacity: 0.5;
cursor: not-allowed;
}

.btn-secondary {
background: var(--surface-2);
color: var(--orange-light);
border: 1px solid var(--orange-dark);
box-shadow: none;
}

.btn-secondary:hover:not(:disabled) {
background: var(--surface-3);
box-shadow: 0 0 14px rgba(255,122,26,0.2);
}

.workout-day {
background: var(--surface);
border: 1px solid var(--border);
border-left: 4px solid var(--orange);
padding: 15px;
margin-bottom: 15px;
border-radius: 10px;
}

.workout-day h3 {
font-family: 'Rajdhani', sans-serif;
letter-spacing: 0.5px;
color: var(--orange-light);
margin-bottom: 8px;
font-size: 18px;
}

.workout-day p {
color: var(--text-dim);
font-size: 13px;
line-height: 1.5;
margin-bottom: 10px;
}

.exercise-log {
background: var(--surface-2);
border: 1px solid var(--border);
padding: 15px;
margin-bottom: 12px;
border-radius: 8px;
}

.exercise-log h4 {
color: var(--text);
margin-bottom: 10px;
font-size: 14px;
}

.log-inputs {
display: grid;
grid-template-columns: 1fr 1fr;
gap: 10px;
margin-bottom: 10px;
}

.log-inputs input {
font-size: 13px;
}

.log-inputs textarea {
grid-column: 1 / -1;
min-height: 60px;
}

.message {
padding: 12px;
border-radius: 8px;
margin-bottom: 15px;
font-size: 13px;
border: 1px solid transparent;
}

.message.info {
background: rgba(255,122,26,0.08);
color: var(--orange-light);
border-left: 3px solid var(--orange);
}

.message.success {
background: rgba(76,217,100,0.08);
color: var(--green);
border-left: 3px solid var(--green);
}

.message.error {
background: rgba(255,92,92,0.08);
color: var(--red);
border-left: 3px solid var(--red);
}

.chat-container {
display: flex;
flex-direction: column;
height: 500px;
border: 1px solid var(--border);
border-radius: 10px;
overflow: hidden;
background: var(--bg-0);
}

.chat-messages {
flex: 1;
overflow-y: auto;
padding: 15px;
display: flex;
flex-direction: column;
gap: 10px;
}

.chat-message {
padding: 10px 12px;
border-radius: 8px;
font-size: 13px;
line-height: 1.4;
max-width: 90%;
white-space: pre-wrap;
}

.chat-message.user {
background: linear-gradient(135deg, var(--orange) 0%, var(--orange-light) 100%);
color: #17120a;
font-weight: 500;
align-self: flex-end;
margin-left: 10%;
}

.chat-message.assistant {
background: var(--surface-2);
color: var(--text);
border: 1px solid var(--border);
align-self: flex-start;
margin-right: 10%;
}

.chat-input-area {
display: flex;
gap: 8px;
padding: 12px;
border-top: 1px solid var(--border);
background: var(--surface);
}

.chat-input-area input {
flex: 1;
margin: 0;
font-size: 13px;
}

.chat-input-area button {
flex: 0;
padding: 8px 16px;
width: auto;
}

.plan-update-card {
background: rgba(255,122,26,0.06);
border: 1px solid var(--orange-dark);
border-radius: 8px;
padding: 12px;
margin: -2px 0 4px 0;
box-shadow: 0 0 18px rgba(255,122,26,0.12);
align-self: flex-start;
max-width: 90%;
}

.plan-update-title {
font-family: 'Rajdhani', sans-serif;
color: var(--orange-light);
font-weight: 700;
font-size: 14px;
letter-spacing: 0.3px;
margin-bottom: 6px;
}

.plan-update-card p {
font-size: 12px;
color: var(--text-dim);
margin-bottom: 10px;
line-height: 1.4;
}

.plan-update-actions {
display: flex;
gap: 8px;
}

.btn-confirm {
background: linear-gradient(135deg, var(--orange) 0%, var(--orange-light) 100%);
color: #17120a;
flex: 1;
padding: 8px;
font-size: 12px;
width: auto;
box-shadow: none;
}

.btn-reject {
background: var(--surface-3);
color: var(--text-dim);
border: 1px solid var(--border);
flex: 1;
padding: 8px;
font-size: 12px;
width: auto;
box-shadow: none;
}

.loading {
text-align: center;
padding: 20px;
color: var(--orange-light);
font-weight: 600;
}

.spinner {
display: inline-block;
width: 20px;
height: 20px;
border: 3px solid rgba(255,122,26,0.15);
border-top: 3px solid var(--orange);
border-radius: 50%;
animation: spin 1s linear infinite;
margin-right: 10px;
}

@keyframes spin {
0% { transform: rotate(0deg); }
100% { transform: rotate(360deg); }
}

.stats {
display: grid;
grid-template-columns: 1fr 1fr;
gap: 12px;
margin-bottom: 15px;
}

.stat-card {
background: linear-gradient(135deg, var(--orange) 0%, var(--orange-dark) 100%);
color: #17120a;
padding: 15px;
border-radius: 10px;
text-align: center;
}

.stat-card .value {
font-family: 'Rajdhani', sans-serif;
font-size: 26px;
font-weight: 700;
margin-bottom: 5px;
}

.stat-card .label {
font-size: 12px;
opacity: 0.85;
}

.close-btn {
background: var(--surface-2);
color: var(--text);
padding: 8px 12px;
font-size: 12px;
width: auto;
margin-top: 10px;
box-shadow: none;
}

.chart-container {
display: flex;
align-items: flex-end;
gap: 8px;
height: 150px;
margin: 15px 0;
padding: 10px;
background: var(--surface);
border: 1px solid var(--border);
border-radius: 10px;
}

.chart-bar-wrap {
flex: 1;
display: flex;
flex-direction: column;
align-items: center;
justify-content: flex-end;
height: 100%;
}

.chart-bar {
width: 100%;
background: linear-gradient(180deg, var(--orange-light) 0%, var(--orange) 100%);
border-radius: 4px 4px 0 0;
min-height: 4px;
box-shadow: 0 0 10px rgba(255,122,26,0.3);
}

.chart-label {
font-size: 11px;
color: var(--text-dim);
margin-top: 4px;
text-align: center;
}

.history-week {
background: var(--surface);
border: 1px solid var(--border);
border-left: 4px solid var(--orange-light);
padding: 15px;
margin-bottom: 12px;
border-radius: 10px;
}

.history-week h3 {
font-family: 'Rajdhani', sans-serif;
color: var(--orange-light);
margin-bottom: 8px;
font-size: 17px;
}

.section-title {
font-family: 'Rajdhani', sans-serif;
font-size: 16px;
letter-spacing: 0.4px;
color: var(--text);
margin-bottom: 10px;
font-weight: 700;
}

.dashboard-block {
margin-bottom: 22px;
padding-bottom: 18px;
border-bottom: 1px solid var(--border);
}

.type-stats-grid {
display: grid;
grid-template-columns: repeat(auto-fill, minmax(135px, 1fr));
gap: 10px;
}

.type-stat-card {
background: linear-gradient(150deg, var(--orange) 0%, var(--orange-dark) 100%);
color: #17120a;
border-radius: 10px;
padding: 13px 10px;
text-align: center;
box-shadow: 0 4px 14px rgba(255,122,26,0.2);
}

.type-stat-icon {
font-size: 22px;
margin-bottom: 4px;
}

.type-stat-name {
font-size: 10.5px;
font-weight: 700;
text-transform: uppercase;
letter-spacing: 0.4px;
opacity: 0.8;
margin-bottom: 3px;
}

.type-stat-value {
font-family: 'Rajdhani', sans-serif;
font-size: 21px;
font-weight: 700;
line-height: 1.1;
}

.type-stat-sub {
font-size: 11px;
opacity: 0.85;
margin-top: 2px;
}

.workout-card {
background: var(--surface-2);
border: 1px solid var(--border);
border-left: 4px solid var(--orange);
border-radius: 8px;
padding: 12px 14px;
margin-bottom: 10px;
cursor: pointer;
transition: border-color 0.2s, background 0.2s;
}

.workout-card:hover {
border-left-color: var(--orange-light);
background: var(--surface-3);
}

.workout-card-header {
display: flex;
justify-content: space-between;
align-items: center;
font-size: 14px;
color: var(--text);
gap: 8px;
}

.workout-card-header-left {
display: flex;
align-items: center;
gap: 8px;
overflow: hidden;
}

.workout-card-icon {
font-size: 17px;
}

.workout-card-daytype {
color: var(--orange-light);
font-weight: 600;
}

.chevron {
color: var(--orange-light);
font-size: 13px;
flex-shrink: 0;
}

.workout-card-summary {
font-size: 12px;
color: var(--text-dim);
margin-top: 5px;
}

.workout-card-body {
margin-top: 10px;
padding-top: 10px;
border-top: 1px solid var(--border);
display: flex;
flex-direction: column;
gap: 8px;
}

.workout-card-exercise-name {
color: var(--text);
font-weight: 600;
font-size: 13px;
margin-bottom: 2px;
}

.workout-card-exercise-detail {
color: var(--text-dim);
font-size: 12px;
line-height: 1.4;
}

.workout-card-total {
margin-top: 4px;
font-size: 13px;
color: var(--orange-light);
font-weight: 700;
}

::-webkit-scrollbar {
width: 8px;
}
::-webkit-scrollbar-track {
background: var(--bg-0);
}
::-webkit-scrollbar-thumb {
background: var(--orange-dark);
border-radius: 4px;
}
</style>
</head>
<body>
<div id="root"></div>

<script type="text/babel">
const { useState, useEffect, useRef } = React;

function FitCoachApp() {
const [currentTab, setCurrentTab] = useState('setup');
const [apiKey, setApiKey] = useState(() => localStorage.getItem('apiKey') || '');
const [userLevel, setUserLevel] = useState(() => localStorage.getItem('userLevel') || 'intermediate');
const [userEquipment, setUserEquipment] = useState(() => localStorage.getItem('userEquipment') || 'complet');
const [userGoals, setUserGoals] = useState(() => localStorage.getItem('userGoals') || '');
const [currentWeekPlan, setCurrentWeekPlan] = useState(() => JSON.parse(localStorage.getItem('weekPlan') || 'null'));
const [weekNumber, setWeekNumber] = useState(() => parseInt(localStorage.getItem('weekNumber') || '1'));
const [logs, setLogs] = useState(() => JSON.parse(localStorage.getItem('logs') || '{}'));
const [weekHistory, setWeekHistory] = useState(() => JSON.parse(localStorage.getItem('weekHistory') || '[]'));
const [chatMessages, setChatMessages] = useState(() => JSON.parse(localStorage.getItem('chatMessages') || '[]'));
const [pendingPlanUpdate, setPendingPlanUpdate] = useState(() => JSON.parse(localStorage.getItem('pendingPlanUpdate') || 'null'));
const [expandedWorkouts, setExpandedWorkouts] = useState({});
const [chatInput, setChatInput] = useState('');
const [loading, setLoading] = useState(false);
const [message, setMessage] = useState('');
const chatEndRef = useRef(null);

const equipmentLabels = {
complet: 'Salle de sport complète (Econofitness, équipement standard)',
halteres: 'Haltères seulement (entraînement à la maison)',
poids_corps: 'Poids du corps uniquement (aucun équipement)'
};

useEffect(() => {
chatEndRef.current && chatEndRef.current.scrollIntoView({ behavior: 'smooth' });
}, [chatMessages, pendingPlanUpdate]);

useEffect(() => {
localStorage.setItem('apiKey', apiKey);
}, [apiKey]);

useEffect(() => {
localStorage.setItem('userLevel', userLevel);
}, [userLevel]);

useEffect(() => {
localStorage.setItem('userEquipment', userEquipment);
}, [userEquipment]);

useEffect(() => {
localStorage.setItem('userGoals', userGoals);
}, [userGoals]);

useEffect(() => {
if (currentWeekPlan) {
localStorage.setItem('weekPlan', JSON.stringify(currentWeekPlan));
} else {
localStorage.removeItem('weekPlan');
}
}, [currentWeekPlan]);

useEffect(() => {
localStorage.setItem('weekNumber', weekNumber);
}, [weekNumber]);

useEffect(() => {
localStorage.setItem('logs', JSON.stringify(logs));
}, [logs]);

useEffect(() => {
localStorage.setItem('weekHistory', JSON.stringify(weekHistory));
}, [weekHistory]);

useEffect(() => {
localStorage.setItem('chatMessages', JSON.stringify(chatMessages));
}, [chatMessages]);

useEffect(() => {
if (pendingPlanUpdate) {
localStorage.setItem('pendingPlanUpdate', JSON.stringify(pendingPlanUpdate));
} else {
localStorage.removeItem('pendingPlanUpdate');
}
}, [pendingPlanUpdate]);

const callClaudeAPI = async (messages, system) => {
if (!apiKey) {
setMessage('Erreur: Veuillez configurer votre clé API Claude d\'abord');
return null;
}

try {
const response = await fetch('/api/claude', {
method: 'POST',
headers: {
'Content-Type': 'application/json',
},
body: JSON.stringify({
apiKey: apiKey,
messages: messages,
system: system
})
});

if (!response.ok) {
const error = await response.json();
throw new Error(error.error || 'Erreur API');
}

const data = await response.json();
return data.content;
} catch (error) {
setMessage('Erreur: ' + error.message);
return null;
}
};

const typeIcon = (type) => {
const t = (type || '').toLowerCase();
if (t.includes('muscu')) return '🏋️';
if (t.includes('run') || t.includes('course')) return '🏃';
if (t.includes('vélo') || t.includes('velo') || t.includes('cycl')) return '🚴';
if (t.includes('cardio')) return '❤️';
if (t.includes('crossfit') || t.includes('wod')) return '🔥';
if (t.includes('rando') || t.includes('hike') || t.includes('marche')) return '🥾';
return '💪';
};

const parseTimeToMinutes = (str) => {
if (!str) return 0;
const parts = String(str).split(':').map(p => parseFloat(p)).filter(n => !isNaN(n));
if (parts.length === 0) {
const n = parseFloat(str);
return isNaN(n) ? 0 : n;
}
if (parts.length === 1) return parts[0];
if (parts.length === 2) return parts[0] + parts[1] / 60;
if (parts.length === 3) return parts[0] * 60 + parts[1] + parts[2] / 60;
return 0;
};

const computeDayStats = (weekEntry, dayIdx, day) => {
let volume = 0, distance = 0, timeMin = 0, loggedCount = 0;
(day.exercises || []).forEach((ex, exIdx) => {
const log = (weekEntry.logs || {})[dayIdx + '-' + exIdx];
if (!log) return;
const w = parseFloat(log.weight) || 0;
const r = parseFloat(log.reps) || 0;
if (w && r) volume += w * r;
if (log.distance) distance += parseFloat(log.distance) || 0;
if (log.time) timeMin += parseTimeToMinutes(log.time);
if (Object.keys(log).length) loggedCount++;
});
return {
volume: Math.round(volume),
distance: Math.round(distance * 10) / 10,
timeMin: Math.round(timeMin),
loggedCount
};
};

const computeWeekTotalVolume = (weekEntry) => {
let total = 0;
(weekEntry.plan.days || []).forEach((day, dayIdx) => {
total += computeDayStats(weekEntry, dayIdx, day).volume;
});
return total;
};

const computeGlobalStatsByType = () => {
const stats = {};
weekHistory.forEach((weekEntry) => {
(weekEntry.plan.days || []).forEach((day, dayIdx) => {
const key = day.type || 'Autre';
if (!stats[key]) stats[key] = { sessions: 0, volume: 0, distance: 0, timeMin: 0 };
const dayStats = computeDayStats(weekEntry, dayIdx, day);
stats[key].sessions += 1;
stats[key].volume += dayStats.volume;
stats[key].distance += dayStats.distance;
stats[key].timeMin += dayStats.timeMin;
});
});
return stats;
};

const primaryMetricText = (type, s) => {
const t = (type || '').toLowerCase();
if (t.includes('muscu')) return s.volume + ' kg';
if (t.includes('run') || t.includes('course') || t.includes('vélo') || t.includes('velo') || t.includes('cycl') || t.includes('rando') || t.includes('hike') || t.includes('marche')) {
return s.distance + ' km';
}
if (t.includes('cardio')) return s.timeMin > 0 ? (s.timeMin + ' min') : (s.sessions + (s.sessions > 1 ? ' séances' : ' séance'));
if (t.includes('crossfit') || t.includes('wod')) return s.sessions + (s.sessions > 1 ? ' WODs' : ' WOD');
return s.sessions + (s.sessions > 1 ? ' séances' : ' séance');
};

const summaryLine = (day, stats) => {
const t = (day.type || '').toLowerCase();
if (t.includes('muscu') && stats.volume > 0) return stats.volume + ' kg soulevés au total';
if ((t.includes('run') || t.includes('course') || t.includes('vélo') || t.includes('velo') || t.includes('cycl') || t.includes('rando')) && stats.distance > 0) return stats.distance + ' km parcourus';
if (t.includes('cardio') && stats.timeMin > 0) return stats.timeMin + ' min au total';
if (stats.loggedCount > 0) return stats.loggedCount + ' exercice(s) enregistré(s)';
return (day.exercises || []).length + ' exercice(s) au programme';
};

const totalLine = (day, stats) => {
const t = (day.type || '').toLowerCase();
if (t.includes('muscu')) return '🏋️ Total: ' + stats.volume + ' kg soulevés';
if (t.includes('run') || t.includes('course') || t.includes('vélo') || t.includes('velo') || t.includes('cycl') || t.includes('rando')) return typeIcon(day.type) + ' Total: ' + stats.distance + ' km';
if (t.includes('cardio')) return '❤️ Total: ' + (stats.timeMin > 0 ? stats.timeMin + ' min' : 'N/A');
return typeIcon(day.type) + ' Séance complétée';
};

const toggleWorkout = (key) => {
setExpandedWorkouts(prev => ({ ...prev, [key]: !prev[key] }));
};

const generateWeekPlan = async () => {
if (!apiKey) {
setMessage('Erreur: Clé API manquante');
return;
}

setLoading(true);
setMessage('Génération de votre plan d\'entraînement...');

const lastWeek = weekHistory[weekHistory.length - 1];
let progressionNote = '';
if (lastWeek) {
const parts = Object.entries(lastWeek.logs || {}).map(([key, val]) => {
const idxParts = key.split('-').map(Number);
const dayIdx = idxParts[0];
const exIdx = idxParts[1];
const day = lastWeek.plan.days[dayIdx];
const ex = day && day.exercises[exIdx];
if (!ex) return null;
const details = [];
if (val.weight) details.push(val.weight + 'kg');
if (val.reps) details.push(val.reps + ' reps');
if (val.distance) details.push(val.distance + 'km');
if (val.time) details.push(val.time);
if (val.notes) details.push('note: ' + val.notes);
return details.length ? (ex.name + ': ' + details.join(', ')) : null;
}).filter(Boolean);
if (parts.length) {
progressionNote = '\nDonnées réelles enregistrées la semaine ' + lastWeek.week + ' (utilise-les pour ajuster intelligemment la progression, augmente légèrement la charge ou le volume si les performances étaient bonnes, sinon stabilise): ' + parts.join('; ');
}
}

const prompt = 'Crée un plan d\'entraînement complet pour une semaine (5 séances) pour quelqu\'un:\n' +
'- Niveau: ' + userLevel + '\n' +
'- Objectifs: ' + userGoals + '\n' +
'- Équipement: ' + equipmentLabels[userEquipment] + '\n' +
'- Types d\'entraînement à varier: Musculation, Running, Crossfit, Cardio, Vélo, Randonnée' + progressionNote + '\n\n' +
'Format de réponse (JSON uniquement, sans texte):\n' +
'{\n' +
'"week": ' + weekNumber + ',\n' +
'"days": [\n' +
'{"day": "Lundi", "type": "Musculation", "exercises": [{"name": "Exercice 1", "sets": "4", "reps": "8-10", "weight": "100kg"}]},\n' +
'{"day": "Mardi", "type": "Running", "exercises": [{"name": "5km Run", "sets": "1", "reps": "N/A", "weight": "Distance: 5km"}]},\n' +
'{"day": "Mercredi", "type": "Cardio", "exercises": [{"name": "Cardio mixte", "sets": "1", "reps": "N/A", "weight": "30min"}]},\n' +
'{"day": "Jeudi", "type": "Crossfit", "exercises": [{"name": "WOD", "sets": "3", "reps": "10-15", "weight": "Variable"}]},\n' +
'{"day": "Vendredi", "type": "Vélo", "exercises": [{"name": "Séance vélo", "sets": "1", "reps": "N/A", "weight": "Distance: 20km"}]}\n' +
']\n' +
'}\n\n' +
'Adapte les exercices à l\'équipement disponible. Crée un plan équilibré et progressif par rapport à la semaine précédente si des données sont fournies. Réponds UNIQUEMENT avec le JSON.';

const result = await callClaudeAPI([{ role: 'user', content: prompt }]);

if (result) {
try {
const jsonMatch = result.match(/\{[\s\S]*\}/);
if (jsonMatch) {
const plan = JSON.parse(jsonMatch[0]);
setCurrentWeekPlan(plan);
setWeekNumber(plan.week || weekNumber);
setMessage('✅ Plan généré avec succès!');
setCurrentTab('plan');
}
} catch (e) {
setMessage('Erreur: Impossible de parser le plan. Réessayez.');
}
}
setLoading(false);
};

const logExercise = (dayIndex, exerciseIndex, data) => {
const key = dayIndex + '-' + exerciseIndex;
setLogs(prev => ({
...prev,
[key]: { ...prev[key], ...data }
}));
};

const sendChatMessage = async () => {
if (!chatInput.trim()) return;

const userMsg = chatInput;
setChatInput('');
const updatedMessages = [...chatMessages, { role: 'user', content: userMsg }];
setChatMessages(updatedMessages);

setLoading(true);

let system = 'Tu es un coach sportif IA personnalisé et bienveillant pour l\'app FitCoach. Contexte de l\'utilisateur: niveau ' + userLevel + ', objectifs: "' + (userGoals || 'non précisés') + '", équipement disponible: ' + equipmentLabels[userEquipment] + ', semaine d\'entraînement actuelle: ' + weekNumber + '. Utilise ce contexte pour donner des conseils personnalisés, concis et pratiques.';

if (currentWeekPlan) {
system += '\n\nVoici le plan d\'entraînement actuel de la semaine, au format JSON: ' + JSON.stringify(currentWeekPlan) + '\n\nSi, au fil de la discussion, tu identifies qu\'une modification concrète de ce plan serait pertinente (ajouter/retirer/remplacer un exercice, changer les séries, répétitions, poids, ou le type d\'une séance, etc.), tu peux la proposer activement. Dans ce cas: 1) Explique clairement en langage normal quel changement tu proposes et pourquoi. 2) Demande explicitement la confirmation de l\'utilisateur avant d\'appliquer quoi que ce soit (tu ne dois JAMAIS appliquer un changement toi-même). 3) À la toute fin de ta réponse uniquement si tu proposes réellement un changement concret, ajoute ce bloc exact contenant le plan COMPLET mis à jour (tous les jours et exercices, modifiés ou non), au format JSON valide strictement identique à la structure fournie: [PLAN_UPDATE_JSON]{...plan complet ici...}[/PLAN_UPDATE_JSON]. N\'inclus ce bloc que si un changement concret est proposé, jamais pour un simple conseil général. Ne mentionne jamais ce bloc technique à l\'utilisateur, contente-toi de poser ta question de confirmation normalement en texte.';
}

const apiMessages = updatedMessages.slice(-12).map(m => ({ role: m.role, content: m.content }));

const result = await callClaudeAPI(apiMessages, system);

if (result) {
const updateMatch = result.match(/\[PLAN_UPDATE_JSON\]([\s\S]*?)\[\/PLAN_UPDATE_JSON\]/);
let cleanText = result;
let proposedPlan = null;
if (updateMatch) {
cleanText = result.replace(updateMatch[0], '').trim();
try {
const parsed = JSON.parse(updateMatch[1].trim());
if (parsed && Array.isArray(parsed.days)) {
proposedPlan = parsed;
}
} catch (e) {
proposedPlan = null;
}
}
setChatMessages(prev => {
const next = [...prev, { role: 'assistant', content: cleanText || result }];
if (proposedPlan) {
setPendingPlanUpdate({ plan: proposedPlan, forIndex: next.length - 1 });
}
return next;
});
}
setLoading(false);
};

const applyPlanUpdate = () => {
if (!pendingPlanUpdate) return;
setCurrentWeekPlan(pendingPlanUpdate.plan);
setWeekNumber(pendingPlanUpdate.plan.week || weekNumber);
setLogs({});
setChatMessages(prev => [...prev, { role: 'assistant', content: '✅ C\'est fait, ton plan d\'entraînement a été mis à jour !' }]);
setPendingPlanUpdate(null);
setMessage('✅ Plan mis à jour par le coach IA');
};

const rejectPlanUpdate = () => {
setPendingPlanUpdate(null);
setChatMessages(prev => [...prev, { role: 'assistant', content: 'Pas de problème, je ne change rien à ton plan.' }]);
};

const finishWeek = () => {
if (currentWeekPlan) {
setWeekHistory(prev => [...prev, { week: currentWeekPlan.week, plan: currentWeekPlan, logs: logs, completedAt: new Date().toISOString() }]);
}
setWeekNumber(prev => prev + 1);
setCurrentWeekPlan(null);
setLogs({});
setMessage('');
setCurrentTab('setup');
};

const globalStatsByType = computeGlobalStatsByType();
const totalSessionsCompleted = weekHistory.reduce((sum, w) => sum + ((w.plan.days || []).length), 0);
const totalVolumeAllTime = weekHistory.reduce((sum, w) => sum + computeWeekTotalVolume(w), 0);

return (
<div className="app">
<div className="header">
<h1>💪 FitCoach</h1>
<p>Votre coach d'entraînement IA</p>
</div>

<div className="content">
<div className="tab-buttons">
<button
className={'tab-btn ' + (currentTab === 'setup' ? 'active' : '')}
onClick={() => setCurrentTab('setup')}
>
⚙️ Config
</button>
<button
className={'tab-btn ' + (currentTab === 'plan' ? 'active' : '')}
onClick={() => setCurrentTab('plan')}
>
📅 Plan
</button>
<button
className={'tab-btn ' + (currentTab === 'chat' ? 'active' : '')}
onClick={() => setCurrentTab('chat')}
>
💬 Coach IA
</button>
<button
className={'tab-btn ' + (currentTab === 'history' ? 'active' : '')}
onClick={() => setCurrentTab('history')}
>
📈 Historique
</button>
</div>

{message && (
<div className={'message ' + (message.startsWith('✅') ? 'success' : message.startsWith('Erreur') ? 'error' : 'info')}>
{message}
</div>
)}

{currentTab === 'setup' && (
<div>
{weekHistory.length > 0 && (
<div className="dashboard-block">
<h2 className="section-title">📊 Ton résumé</h2>
<div className="stats">
<div className="stat-card">
<div className="value">{totalSessionsCompleted}</div>
<div className="label">Séances complétées</div>
</div>
<div className="stat-card">
<div className="value">{weekHistory.length}</div>
<div className="label">Semaines terminées</div>
</div>
</div>
<div className="type-stats-grid">
{Object.entries(globalStatsByType).map(([type, s]) => (
<div className="type-stat-card" key={type}>
<div className="type-stat-icon">{typeIcon(type)}</div>
<div className="type-stat-name">{type}</div>
<div className="type-stat-value">{primaryMetricText(type, s)}</div>
<div className="type-stat-sub">{s.sessions + (s.sessions > 1 ? ' séances' : ' séance')}</div>
</div>
))}
</div>
</div>
)}

<h2 style={{marginBottom: '15px', color: 'var(--text)'}}>Configuration Initiale</h2>

<div className="form-group">
<label>🔑 Clé API Claude</label>
<input
type="password"
value={apiKey}
onChange={(e) => setApiKey(e.target.value)}
placeholder="sk-ant-..."
/>
<small style={{color: 'var(--text-dim)', marginTop: '5px', display: 'block'}}>
👉 Obtenez votre clé sur console.anthropic.com
</small>
</div>

<div className="form-group">
<label>📊 Votre Niveau</label>
<select value={userLevel} onChange={(e) => setUserLevel(e.target.value)}>
<option value="beginner">Débutant</option>
<option value="intermediate">Intermédiaire</option>
<option value="advanced">Avancé</option>
</select>
</div>

<div className="form-group">
<label>🏋️ Équipement Disponible</label>
<select value={userEquipment} onChange={(e) => setUserEquipment(e.target.value)}>
<option value="complet">Salle de sport complète</option>
<option value="halteres">Haltères seulement</option>
<option value="poids_corps">Poids du corps uniquement</option>
</select>
</div>

<div className="form-group">
<label>🎯 Vos Objectifs</label>
<textarea
value={userGoals}
onChange={(e) => setUserGoals(e.target.value)}
placeholder="Ex: Me préparer pour mon Hyrox du 19 septembre, prendre du muscle..."
/>
</div>

<button onClick={generateWeekPlan} disabled={loading}>
{loading ? (
<>
<span className="spinner"></span>
Génération...
</>
) : (
'🚀 Générer Plan Semaine ' + weekNumber
)}
</button>
</div>
)}

{currentTab === 'plan' && currentWeekPlan && (
<div>
<div style={{display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: '15px'}}>
<h2 style={{color: 'var(--text)'}}>Semaine {currentWeekPlan.week}</h2>
<button className="btn-secondary" onClick={finishWeek} style={{width: 'auto', padding: '8px 16px'}}>
✅ Terminer la semaine
</button>
</div>

{currentWeekPlan.days.map((day, dayIdx) => (
<div key={dayIdx} className="workout-day">
<h3>{day.day} - {day.type}</h3>

{day.exercises.map((ex, exIdx) => {
const logKey = dayIdx + '-' + exIdx;
const logged = logs[logKey] || {};

return (
<div key={exIdx} className="exercise-log">
<h4>{ex.name}</h4>
<p style={{marginBottom: '10px', fontSize: '12px', color: 'var(--text-dim)'}}>
{ex.sets} x {ex.reps} {ex.weight ? ('@ ' + ex.weight) : ''}
</p>

<div className="log-inputs">
<input
type="number"
placeholder="Poids (kg)"
value={logged.weight || ''}
onChange={(e) => logExercise(dayIdx, exIdx, {weight: e.target.value})}
/>
<input
type="number"
placeholder="Reps"
value={logged.reps || ''}
onChange={(e) => logExercise(dayIdx, exIdx, {reps: e.target.value})}
/>
<input
type="number"
placeholder="Distance (km)"
value={logged.distance || ''}
onChange={(e) => logExercise(dayIdx, exIdx, {distance: e.target.value})}
/>
<input
type="text"
placeholder="Temps (ex: 30:45)"
value={logged.time || ''}
onChange={(e) => logExercise(dayIdx, exIdx, {time: e.target.value})}
/>
<textarea
placeholder="Notes (sensation, difficulté...)"
value={logged.notes || ''}
onChange={(e) => logExercise(dayIdx, exIdx, {notes: e.target.value})}
/>
</div>
{Object.keys(logged).length > 0 && <p style={{fontSize: '12px', color: 'var(--orange-light)', marginTop: '8px'}}>✅ Données enregistrées</p>}
</div>
);
})}
</div>
))}
</div>
)}

{currentTab === 'plan' && !currentWeekPlan && (
<div className="message info">
Allez dans l'onglet Configuration pour générer votre plan d'entraînement
</div>
)}

{currentTab === 'chat' && (
<div>
<h2 style={{marginBottom: '15px', color: 'var(--text)'}}>Coach IA</h2>
<p style={{marginBottom: '15px', fontSize: '13px', color: 'var(--text-dim)'}}>
Posez vos questions sur l'entraînement, la technique, la nutrition... Le coach peut aussi proposer d'ajuster ton plan, mais il te demandera toujours ta confirmation avant de l'appliquer.
</p>

<div className="chat-container">
<div className="chat-messages">
{chatMessages.length === 0 && (
<div style={{textAlign: 'center', color: 'var(--text-dim)', marginTop: '20px'}}>
Commence la conversation! 💪
</div>
)}
{chatMessages.map((msg, idx) => (
<React.Fragment key={idx}>
<div className={'chat-message ' + msg.role}>
{msg.content}
</div>
{pendingPlanUpdate && pendingPlanUpdate.forIndex === idx && (
<div className="plan-update-card">
<div className="plan-update-title">🔄 Modification de plan proposée</div>
<p>Le coach souhaite mettre à jour ton plan d'entraînement de la semaine {pendingPlanUpdate.plan.week || weekNumber}. Veux-tu appliquer ces changements ?</p>
<div className="plan-update-actions">
<button className="btn-confirm" onClick={applyPlanUpdate}>✅ Appliquer</button>
<button className="btn-reject" onClick={rejectPlanUpdate}>❌ Ignorer</button>
</div>
</div>
)}
</React.Fragment>
))}
{loading && (
<div className="chat-message assistant">
<span className="spinner"></span> Coach réfléchit...
</div>
)}
<div ref={chatEndRef} />
</div>

<div className="chat-input-area">
<input
type="text"
value={chatInput}
onChange={(e) => setChatInput(e.target.value)}
onKeyPress={(e) => e.key === 'Enter' && sendChatMessage()}
placeholder="Votre question..."
disabled={loading}
/>
<button onClick={sendChatMessage} disabled={loading} style={{margin: 0}}>
↩️
</button>
</div>
</div>
</div>
)}

{currentTab === 'history' && (
<div>
<h2 style={{marginBottom: '15px', color: 'var(--text)'}}>📈 Historique & Progression</h2>
{weekHistory.length === 0 && (
<div className="message info">
Aucune semaine terminée pour l'instant. Complète ta semaine et clique sur "✅ Terminer la semaine" dans l'onglet Plan pour commencer ton historique.
</div>
)}
{weekHistory.length > 0 && (
<div>
<h3 className="section-title">Vue d'ensemble par activité</h3>
<div className="stats">
<div className="stat-card">
<div className="value">{totalSessionsCompleted}</div>
<div className="label">Séances complétées</div>
</div>
<div className="stat-card">
<div className="value">{totalVolumeAllTime}</div>
<div className="label">Kg soulevés au total</div>
</div>
</div>
<div className="type-stats-grid" style={{marginBottom: '20px'}}>
{Object.entries(globalStatsByType).map(([type, s]) => (
<div className="type-stat-card" key={type}>
<div className="type-stat-icon">{typeIcon(type)}</div>
<div className="type-stat-name">{type}</div>
<div className="type-stat-value">{primaryMetricText(type, s)}</div>
<div className="type-stat-sub">{s.sessions + (s.sessions > 1 ? ' séances' : ' séance')}</div>
</div>
))}
</div>

<h3 style={{marginBottom: '10px', fontSize: '14px', color: 'var(--text-dim)'}}>Volume total (poids x reps) par semaine</h3>
<div className="chart-container">
{weekHistory.slice(-8).map((w, idx, arr) => {
const vol = computeWeekTotalVolume(w);
const maxVol = Math.max.apply(null, arr.map(computeWeekTotalVolume).concat([1]));
const heightPct = Math.max((vol / maxVol) * 100, 4);
return (
<div className="chart-bar-wrap" key={idx}>
<div className="chart-bar" style={{height: heightPct + '%'}} title={vol + ' kg'}></div>
<div className="chart-label">{'S' + w.week}</div>
</div>
);
})}
</div>

<h3 className="section-title" style={{marginTop: '10px'}}>Détail des séances</h3>
{weekHistory.slice().reverse().map((w, wIdx) => (
<div className="history-week" key={wIdx}>
<h3>{'Semaine ' + w.week + ' — ' + new Date(w.completedAt).toLocaleDateString('fr-FR')}</h3>
<p style={{fontSize: '12px', color: 'var(--orange-light)', marginBottom: '10px'}}>{'Volume: ' + computeWeekTotalVolume(w) + ' kg cumulés'}</p>
{(w.plan.days || []).map((day, dayIdx) => {
const cardKey = w.week + '-' + dayIdx;
const stats = computeDayStats(w, dayIdx, day);
const isOpen = !!expandedWorkouts[cardKey];
return (
<div className="workout-card" key={dayIdx} onClick={() => toggleWorkout(cardKey)}>
<div className="workout-card-header">
<div className="workout-card-header-left">
<span className="workout-card-icon">{typeIcon(day.type)}</span>
<span><strong>{day.day}</strong> <span className="workout-card-daytype">— {day.type}</span></span>
</div>
<span className="chevron">{isOpen ? '▾' : '▸'}</span>
</div>
<div className="workout-card-summary">{summaryLine(day, stats)}</div>
{isOpen && (
<div className="workout-card-body" onClick={(e) => e.stopPropagation()}>
{(day.exercises || []).map((ex, exIdx) => {
const log = (w.logs || {})[dayIdx + '-' + exIdx] || {};
const hasLog = Object.keys(log).length > 0;
return (
<div key={exIdx}>
<div className="workout-card-exercise-name">{ex.name}</div>
<div className="workout-card-exercise-detail">
{'Prévu: ' + ex.sets + ' x ' + ex.reps + (ex.weight ? (' @ ' + ex.weight) : '')}
{hasLog && (
<><br />
{'Réalisé: '}
{log.weight ? (log.weight + 'kg x ' + (log.reps || '?') + ' reps ') : ''}
{log.distance ? (log.distance + 'km ') : ''}
{log.time ? (log.time + ' ') : ''}
{log.notes ? ('— "' + log.notes + '"') : ''}
</>
)}
</div>
</div>
);
})}
<div className="workout-card-total">{totalLine(day, stats)}</div>
</div>
)}
</div>
);
})}
</div>
))}
</div>
)}
</div>
)}
</div>
</div>
);
}

ReactDOM.render(<FitCoachApp />, document.getElementById('root'));

</script>
</body>
</html>
